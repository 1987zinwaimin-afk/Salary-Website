<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6948ff">
<title>Salary Manager — Shared Loan</title>
<style>
:root{--p:#6948ff;--p2:#9a38ff;--blue:#168fe8;--green:#12bd7b;--red:#e84b63;--ink:#172033;--muted:#71809a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#ddf8ff,#f5f6ff 45%,#eeeaff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px 12px 40px}.head{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:24px;background:linear-gradient(145deg,#a238ff,#6948ff);box-shadow:7px 8px 0 #4930a522}.head h1{margin:0;font-size:20px}.head p{margin:2px 0;color:var(--muted);font-size:11px}.live{margin-left:auto;padding:7px 10px;border-radius:99px;background:#e5fff4;color:#0a9d66;font-size:10px;font-weight:900}.hidden{display:none!important}.updated{text-align:right;color:var(--muted);font-size:10px;margin-bottom:9px}.hero{padding:19px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#5736ea,#9d39ff 52%,#078fe8);box-shadow:0 18px 40px #6338e63b}.heroName{font-size:27px;font-weight:950}.heroDue{font-size:24px;font-weight:950;margin-top:5px}.heroSub{opacity:.86;font-size:11px;margin-top:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card{background:#ffffffef;border:1px solid #e0e4ee;border-radius:19px;padding:13px;box-shadow:0 8px 22px #24304a10}.label{color:var(--muted);font-size:11px}.big{font-size:20px;font-weight:950;margin-top:3px}.notice{margin-top:10px;padding:13px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#ff9f1c,#ff4d67,#9a38ff);box-shadow:0 10px 24px #ff4d6730}.notice b{display:block;font-size:12px}.notice div{margin-top:5px;font-size:12px;line-height:1.5;white-space:pre-wrap}.tabs{display:flex;gap:9px;overflow-x:auto;padding:12px 1px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 125px;min-height:92px;padding:12px;border-radius:19px;border:1px solid #dedcf0;background:linear-gradient(145deg,#fff,#f5f0ff);box-shadow:0 8px 20px #4330a414;text-align:left;cursor:pointer}.tab.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#5b38e8,#a238ff,#178fe9);transform:translateY(-2px);box-shadow:0 12px 25px #6841d044}.tab .ico{font-size:24px}.tab b{display:block;margin-top:3px;font-size:14px}.tab small{display:block;margin-top:5px;opacity:.82;font-size:10px}.detail{margin-top:2px;padding:16px;border-radius:23px;background:#fff;border:1px solid #e0e4ee;box-shadow:0 10px 28px #24304a12}.detailTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.type{font-size:20px;font-weight:950}.sub{font-size:11px;color:var(--muted);margin-top:2px}.remain{font-size:21px;font-weight:950;color:var(--red);text-align:right}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf0f5;font-size:12px}.row:last-child{border-bottom:0}.right{text-align:right;font-weight:850}.red{color:var(--red)}.green{color:#0b9d65}.pay{width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,#08ad75,#18d494,#168fe8);font-weight:950;font-size:14px;box-shadow:0 10px 24px #0cbd7b35;cursor:pointer}.warning{margin-top:10px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#fff1f4,#ffe5eb);border:1px solid #ffb7c5;color:#bf2946;box-shadow:0 7px 18px #ff496622;animation:float3d 2.5s ease-in-out infinite}.warning b{display:block;font-size:12px;line-height:1.55}.empty,.err{margin-top:10px;padding:28px 15px;background:#fff;border-radius:20px;color:var(--muted);text-align:center}.err{background:#fff0f2;color:#c73750;text-align:left}.note{font-size:10px;color:#71809a;line-height:1.45;margin-top:12px;text-align:center}@keyframes float3d{0%,100%{transform:perspective(700px) rotateX(0) translateY(0)}50%{transform:perspective(700px) rotateX(3deg) translateY(-3px)}}
#viewerGate,#payModal{position:fixed;inset:0;background:rgba(12,14,35,.68);backdrop-filter:blur(7px);z-index:100;display:grid;place-items:center;padding:18px}.sheet{width:min(430px,100%);border-radius:27px;padding:20px;background:linear-gradient(145deg,#fff,#f5f1ff);box-shadow:0 25px 70px #0007}.sheet h2{text-align:center;margin:0;font-size:21px}.sheet p{text-align:center;color:var(--muted);font-size:11px;line-height:1.5}.sheet input{width:100%;padding:13px;border:2px solid #d7d0ff;border-radius:15px;outline:0;font-size:17px}.currency{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.currency button{padding:10px;border:0;border-radius:12px;background:#f0f1f7;color:#687286;font-weight:900}.currency button.active{background:#e5f0ff;color:#1769ff;box-shadow:inset 0 0 0 2px #6b91ff}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.quick button{padding:8px 3px;border:0;border-radius:11px;background:#eae7ff;color:#6340dc;font-weight:850;font-size:10px}.requestInfo{padding:10px;border-radius:13px;background:#fff8df;border:1px solid #efd68c;color:#7b5a00;font-size:11px;line-height:1.45;margin-top:8px}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.modalBtns button{padding:12px;border:0;border-radius:13px;font-weight:900}.send{color:#fff;background:linear-gradient(135deg,#6948ff,#a238ff,#168fe8)}.cancel{background:#e9eaf0;color:#596174}.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(430px,calc(100% - 24px));padding:13px 15px;border-radius:16px;background:#fff;box-shadow:0 15px 45px #0003;z-index:200;border-left:5px solid #18b978;font-size:12px;font-weight:800}.status{margin-top:10px;padding:11px;border-radius:15px;background:#edfdf7;color:#0a9563;font-size:11px;font-weight:800}.status.reject{background:#fff0f2;color:#c73750}.spinner{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:500px){.wrap{padding:10px 10px 30px}.heroName{font-size:24px}.grid{gap:7px}.tab{flex-basis:116px;min-height:88px}.detail{padding:13px}.remain{font-size:18px}.sheet{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">📒</div><div><h1>Salary Manager</h1><p>Shared Loan Statement</p></div><div id="live" class="live hidden">● LIVE</div></div>
  <div id="updated" class="updated"></div>
  <div id="content"><div class="spinner">စာရင်းကို ရယူနေသည်…</div></div>
  <div class="note">Owner က Update လုပ်တိုင်း ဒီ Share Link က စာရင်းအသစ်ကို အလိုအလျောက် ပြန်ယူပေးပါတယ်။</div>
</div>
<script>
'use strict';
const SUPABASE_URL='https://lsnmcdzupctwizxldjhc.supabase.co';
const SUPABASE_KEY='sb_publishable_iJQ9BpS19OtdaYXM31J3ag_Mhljn8Xi';
const token=location.hash.slice(1).trim();
let current=null,activeIndex=0,payCurrency='THB',pollTimer=null,lastRowSig='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('en-US');
const money=(n,c)=>(fmt(n)+' '+(c==='MMK'?'MMK':'THB'));
const deviceLabel=()=>{const ua=navigator.userAgent||'';const os=/Windows/i.test(ua)?'Windows':/Android/i.test(ua)?'Android':/iPhone|iPad/i.test(ua)?'iPhone/iPad':/Mac OS/i.test(ua)?'Mac':'Browser';const b=/Edg\//i.test(ua)?'Edge':/Chrome\//i.test(ua)?'Chrome':/Firefox\//i.test(ua)?'Firefox':/Safari\//i.test(ua)?'Safari':'Browser';return b+' / '+os};
const viewerKey='salary_share_viewer_name_v1';
const viewerName=()=>String(localStorage.getItem(viewerKey)||'').trim();
const setViewerName=n=>localStorage.setItem(viewerKey,String(n||'').trim());
async function rpc(name,body){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function months(date){if(!date)return 0;const d=new Date(date+'T00:00:00'),now=new Date();let v=(now.getFullYear()-d.getFullYear())*12+now.getMonth()-d.getMonth();if(now.getDate()<d.getDate())v--;return Math.max(0,v)}
function calc(l){const p=Math.max(0,+l.principal||0),r=Math.max(0,+l.rate||10),mon=p*r/100,elapsed=months(l.loanDate),ip=Math.max(0,+l.interestPaid||0),stop=Math.max(0,+l.interestStop||0),paidMonths=mon>0?Math.min(elapsed,Math.floor(ip/mon)):0,unpaid=Math.max(0,elapsed-paidMonths),accrued=mon*elapsed,due=Math.max(0,accrued-ip-stop),pp=Math.max(0,+l.principalPaid||0),rp=Math.max(0,p-pp),payments=(Array.isArray(l.payments)?l.payments:[]).reduce((a,x)=>a+(+x.amount||0),0),total=Math.max(0,rp+due-payments);return{p,r,mon,elapsed,paidMonths,unpaid,accrued,due,rp,payments,total,c:l.currency||'THB'}}
function threeMisses(l){const expected=+l.monthlyPayment||0;if(expected<=0)return false;const pays=Array.isArray(l.payments)?l.payments:[],now=new Date();for(let i=0;i<3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const sum=pays.filter(p=>{const x=new Date(p.createdAt||p.date||0);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()}).reduce((a,p)=>a+(+p.amount||0),0);if(sum>=expected)return false}return true}
async function fetchShare(){if(!token)return null;const rows=await rpc('get_salary_share',{p_share_token:token});return rows?.[0]||null}
async function recordView(){if(!token||!viewerName())return;const k='salary_view_recorded_v2_'+token+'_'+viewerName();if(sessionStorage.getItem(k))return;try{await rpc('record_salary_share_view_v2',{p_share_token:token,p_viewer_name:viewerName(),p_device_label:deviceLabel(),p_user_agent:navigator.userAgent||''});sessionStorage.setItem(k,'1')}catch(e){console.warn('record view',e)}}
function showViewerGate(){if(viewerName())return Promise.resolve();return new Promise(resolve=>{const d=document.createElement('div');d.id='viewerGate';d.innerHTML='<div class="sheet"><h2>👤 စာရင်းကြည့်သူအမည်</h2><p>Owner Notification မှာ သင်ဘယ်သူစာရင်းဝင်ကြည့်နေတယ်ဆိုတာ ပြရန် အမည်ထည့်ပါ။</p><input id="viewerInput" placeholder="ဥပမာ — Zin Min Thu"><button id="viewerSave" class="pay" style="margin-top:10px">ဆက်မည်</button></div>';document.body.appendChild(d);document.getElementById('viewerSave').onclick=()=>{const n=document.getElementById('viewerInput').value.trim();if(!n)return alert('အမည်ထည့်ပါ');setViewerName(n);d.remove();recordView();resolve()}})}
function render(row){current=row;if(!row){document.getElementById('content').innerHTML='<div class="err"><b>Share Link စာရင်းမတွေ့ပါ။</b><br><br>Share Link ကို Owner ဆီက ပြန်ဖွင့်ပေးပါ။</div>';return}const loans=Array.isArray(row.payload?.loans)?row.payload.loans:[],cs=loans.map(calc),groups={MMK:{total:0},THB:{total:0}};cs.forEach(c=>groups[c.c].total+=c.total);const name=row.person_name||row.payload?.name||'',notice=String(row.payload?.notice||'');document.getElementById('live').classList.remove('hidden');document.getElementById('updated').textContent=row.updated_at?'Updated '+new Date(row.updated_at).toLocaleString():'Live';let h='<div class="hero"><div class="heroName">'+esc(name)+'</div><div class="heroDue">လက်ကျန်စာရင်း</div><div class="heroSub">'+loans.length+' မျိုး · Live Share</div></div>';if(notice)h+='<div class="notice"><b>📢 Owner သတိပေးစာ</b><div>'+esc(notice)+'</div></div>';h+='<div class="grid"><div class="card"><div class="label">🇲🇲 မြန်မာငွေ</div><div class="big">'+money(groups.MMK.total,'MMK')+'</div></div><div class="card"><div class="label">🇹🇭 ထိုင်းငွေ</div><div class="big">'+money(groups.THB.total,'THB')+'</div></div></div>';if(!loans.length){h+='<div class="empty">ဒီအမည်နဲ့ ချေးငွေစာရင်းမရှိသေးပါ။</div>'}else{h+='<div class="tabs">'+loans.map((l,i)=>'<button class="tab '+(i===activeIndex?'active':'')+'" onclick="selectLoan('+i+')"><span class="ico">💳</span><b>'+esc(l.type||'Loan')+'</b><small>'+money(cs[i].total,cs[i].c)+'</small></button>').join('')+'</div>';const i=Math.min(activeIndex,loans.length-1),l=loans[i],c=cs[i];h+='<div class="detail"><div class="detailTop"><div><div class="type">💳 '+esc(l.type||'Loan')+'</div><div class="sub">'+esc(l.loanDate||'')+' · '+c.c+'</div></div><div class="remain">'+money(c.total,c.c)+'</div></div><div style="margin-top:10px">';[['မူရင်းချေးငွေ',money(c.p,c.c)],['တစ်လအတိုး',money(c.mon,c.c)],['အတိုးပေးပြီးလ',c.paidMonths+' လ'],['အတိုးမပေးသေးသောလ',c.unpaid+' လ'],['အတိုးလက်ကျန်',money(c.due,c.c)],['မူရင်းလက်ကျန်',money(c.rp,c.c)],['လစဉ်သတ်မှတ်ငွေ',money(+l.monthlyPayment||0,c.c)],['စုစုပေါင်းပေးချေပြီး',money(c.payments,c.c)]].forEach(x=>h+='<div class="row"><span>'+x[0]+'</span><span class="right">'+x[1]+'</span></div>');h+='</div>';if(threeMisses(l))h+='<div class="warning"><b>⚠️ လစဉ်သတ်မှတ်ငွေ 3 လဆက်တိုက် မပြည့်ပါက အတိုးရပ်ထားသည်ကို ပြန်လည်ရပ်ဆိုင်းပြီး အတိုးပြန်လည်သတ်မှတ်ပါမည်။</b></div>';h+='<button class="pay" data-pay="'+esc(l.id)+'">💸 ချေးငွေပြန်ဆပ်မည်</button></div>'}document.getElementById('content').innerHTML=h;attachPay();}
function selectLoan(i){activeIndex=i;render(current)}
function attachPay(){document.querySelectorAll('[data-pay]').forEach(b=>{if(b.dataset.ready)return;b.dataset.ready='1';b.onclick=()=>openPay(b.dataset.pay)})}
function openPay(id){const loans=Array.isArray(current?.payload?.loans)?current.payload.loans:[],l=loans.find(x=>String(x.id)===String(id));if(!l)return;payCurrency=l.currency||'THB';const old=document.getElementById('payModal');if(old)old.remove();const expected=+l.monthlyPayment||0;const html='<div id="payModal"><div class="sheet"><h2>💸 ချေးငွေပြန်ဆပ်ရန်</h2><p><b>'+esc(l.type||'Loan')+'</b><br>Owner ထံ Approval Request ပို့မည်။<br><b>Owner လက်ခံမှသာ</b> စာရင်းလျော့ပါမည်။</p><div class="currency"><button id="curMMK" class="'+(payCurrency==='MMK'?'active':'')+'">🇲🇲 မြန်မာငွေ MMK</button><button id="curTHB" class="'+(payCurrency==='THB'?'active':'')+'">🇹🇭 ထိုင်းငွေ THB</button></div><input id="payAmount" type="number" min="1" step="any" placeholder="ပေးချေမည့်ငွေအမောက်ထည့်ပါ"><div class="quick"><button onclick="addAmt(1000)">+1,000</button><button onclick="addAmt(5000)">+5,000</button><button onclick="addAmt(10000)">+10,000</button><button onclick="addAmt(50000)">+50,000</button></div><div class="requestInfo">ချေးငွေငွေကြေး: '+(l.currency||'THB')+'<br>လက်ကျန်: '+money(calc(l).total,l.currency||'THB')+'<br>သတ်မှတ်ငွေ: '+money(expected,l.currency||'THB')+'</div><div class="modalBtns"><button class="cancel" id="payClose">ပိတ်မည်</button><button class="send" id="paySend">📨 Request ပို့မည်</button></div></div></div>';document.body.insertAdjacentHTML('beforeend',html);const setCur=c=>{payCurrency=c;document.getElementById('curMMK').classList.toggle('active',c==='MMK');document.getElementById('curTHB').classList.toggle('active',c==='THB')};document.getElementById('curMMK').onclick=()=>setCur('MMK');document.getElementById('curTHB').onclick=()=>setCur('THB');document.getElementById('payClose').onclick=()=>document.getElementById('payModal')?.remove();document.getElementById('paySend').onclick=async()=>{const amount=+document.getElementById('payAmount').value||0;if(amount<=0)return alert('ပေးချေမည့်ငွေအမောက်ထည့်ပါ');if(payCurrency!==(l.currency||'THB'))return alert('ဒီချေးငွေအတွက် '+(l.currency||'THB')+' ကိုသာ ရွေးပေးပါ');const b=document.getElementById('paySend');b.disabled=true;b.textContent='⏳ Request ပို့နေသည်...';try{await rpc('submit_salary_payment_request',{p_share_token:token,p_loan_id:String(l.id),p_payer_name:viewerName()||'Guest',p_amount:amount,p_currency:payCurrency,p_device_label:deviceLabel()});document.getElementById('payModal')?.remove();toast('📨 Owner ဆီ Approval Request ပို့ပြီးပါပြီ။ Approval ရမှသာ စာရင်းလျော့ပါမည်။')}catch(e){b.disabled=false;b.textContent='📨 Request ပို့မည်';alert('Request ပို့မရပါ။ '+String(e.message||'ပြန်စမ်းပါ'))}}}
function addAmt(v){const x=document.getElementById('payAmount');if(x)x.value=(+x.value||0)+v}
function toast(msg,ok=true){const x=document.createElement('div');x.className='toast';x.style.borderLeftColor=ok?'#18b978':'#ef4760';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),5000)}
async function poll(){try{const row=await fetchShare();if(!row)return;const sig=String(row.updated_at||JSON.stringify(row.payload||{}));if(sig!==lastRowSig){lastRowSig=sig;render(row)}const ns=await rpc('get_salary_share_notifications',{p_share_token:token,p_viewer_name:viewerName()||'Guest'});const latest=(ns||[]).find(x=>x.type==='payment_approved'||x.type==='payment_rejected');if(latest){const k='salary_share_last_notice_'+token;if(localStorage.getItem(k)!==String(latest.id)){localStorage.setItem(k,String(latest.id));toast(latest.type==='payment_approved'?'✅ Owner က ငွေပေးချေမှုကို လက်ခံပြီးပါပြီ။ စာရင်းလျော့ပြီးပါပြီ။':'❌ Owner က Payment Request ကို ငြင်းပယ်လိုက်ပါပြီ။',latest.type==='payment_approved')}}}catch(e){console.warn('share poll',e)}}
async function boot(){if(!token){document.getElementById('content').innerHTML='<div class="err"><b>Share Link မပြည့်စုံပါ။</b><br><br>Owner ဆီက ရလာတဲ့ Share Link ကို အပြည့်အစုံဖွင့်ပါ။</div>';return}await showViewerGate();await recordView();await poll();clearInterval(pollTimer);pollTimer=setInterval(poll,5000)}
boot();
</script>
</body>
</html>
