<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#6948ff"><title>အကြွေးစာရင်း</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edfaff,#f6f2ff);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:18px 14px 40px}.head{display:flex;align-items:center;gap:11px;margin:4px 0 10px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#9a4dff,#6948ff);color:#fff;font-size:24px}.head h1{margin:0;font-size:21px}.head p{margin:2px 0;color:#71809a;font-size:12px}.live{margin-left:auto;padding:6px 9px;border-radius:99px;background:#e6fff4;color:#0b9d65;font-size:10px;font-weight:900}.updated{margin:0 0 10px;color:#71809a;font-size:11px;text-align:right}.hero{padding:18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#6041e9,#934cff);box-shadow:0 16px 35px #603ce73d}.hero .name{font-size:25px;font-weight:900}.hero .due{font-size:28px;font-weight:900;margin-top:5px}.hero .sub{opacity:.85;font-size:11px;margin-top:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card{background:#fff;border:1px solid #e2e5ec;border-radius:18px;padding:13px;box-shadow:0 8px 22px #24304a0d}.card .label{color:#71809a;font-size:11px}.card .big{font-size:20px;font-weight:900;margin-top:3px}.loan{margin-top:10px;padding:15px;border-radius:19px;background:#fff;border:1px solid #e0e4ed;box-shadow:0 8px 22px #24304a0d}.loanHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.loanTitle{font-size:16px;font-weight:900}.loanSub{font-size:11px;color:#71809a;margin-top:2px}.rows{margin-top:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eef0f4;font-size:12px}.row:last-child{border-bottom:0}.right{text-align:right;font-weight:800}.red{color:#d83d54}.empty{text-align:center;padding:35px 15px;background:#fff;border-radius:20px;color:#71809a}.err{padding:18px;background:#fff0f2;color:#c73750;border-radius:18px}.note{font-size:11px;color:#71809a;line-height:1.45;margin-top:10px}@media(max-width:390px){.grid{gap:7px}.card{padding:11px}.loan{padding:13px}.hero .due{font-size:25px}}</style></head><body><div class="wrap"><div class="head"><div class="logo">📒</div><div><h1>Salary Manager</h1><p>Shared Loan Statement</p></div><div id="live" class="live hidden">● LIVE</div></div><div id="updated" class="updated"></div><div id="content"></div><div class="note">Owner က စာရင်း Update လုပ်လိုက်တိုင်း ဒီ Share Link က အလိုအလျောက် စာရင်းအသစ်ကို ပြန်ယူပေးပါတယ်။</div></div><script>
const SUPABASE_URL='https://lsnmcdzupctwizxldjhc.supabase.co';
const SUPABASE_KEY='sb_publishable_iJQ9BpS19OtdaYXM31J3ag_Mhljn8Xi';
const token=location.hash.slice(1).trim();
let data=null,lastUpdated='';
function legacyDec(s){try{let b=s.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))))}catch(e){return null}}
function n(x){return (+x||0).toLocaleString('en-US')}
function m(x,c){return n(x)+' '+(c==='MMK'?'MMK':'THB')}
function pname(l){return String(l?.name||l?.person||l?.employee||l?.borrower||l?.customer||l?.owner||'')}
function months(date){if(!date)return 0;let d=new Date(date+'T00:00:00'),now=new Date();let v=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());if(now.getDate()<d.getDate())v--;return Math.max(0,v)}
function calc(l){let p=Math.max(0,+l.principal||0),r=Math.max(0,+l.rate||10),mon=p*r/100,elapsed=months(l.loanDate),ip=Math.max(0,+l.interestPaid||0),stop=Math.max(0,+l.interestStop||0),paid=mon>0?Math.min(elapsed,Math.floor(ip/mon)):0,unpaid=Math.max(0,elapsed-paid),accrued=mon*elapsed,due=Math.max(0,accrued-ip-stop),pp=Math.max(0,+l.principalPaid||0),rp=Math.max(0,p-pp);return{p,r,mon,elapsed,paid,unpaid,accrued,due,rp,total:rp+due,c:l.currency||'THB'}}
function render(){const el=document.getElementById('content');if(!data||!data.name){el.innerHTML='<div class="empty">Share Link မမှန်ပါ။</div>';return}let loans=Array.isArray(data.loans)?data.loans:[],cs=loans.map(calc),principal=cs.reduce((a,c)=>a+c.p,0),due=cs.reduce((a,c)=>a+c.total,0),currency=cs[0]?.c||'THB';el.innerHTML='<div class="hero"><div class="name">'+data.name+'</div><div class="due">ကျန်ငွေ '+m(due,currency)+'</div><div class="sub">ယူထားသောချေးငွေ '+n(loans.length)+' ခု</div></div><div class="grid"><div class="card"><div class="label">မူရင်းချေးငွေ</div><div class="big">'+m(principal,currency)+'</div></div><div class="card"><div class="label">ပေးရန်စုစုပေါင်း</div><div class="big red">'+m(due,currency)+'</div></div></div>'+ (loans.length?loans.map((l,i)=>{let c=cs[i];return '<div class="loan"><div class="loanHead"><div><div class="loanTitle">💳 '+(l.title||l.type||'Loan')+'</div><div class="loanSub">'+(l.loanDate||'')+'</div></div><div class="right red">'+m(c.total,c.c)+'</div></div><div class="rows"><div class="row"><span>မူရင်း</span><span class="right">'+m(c.p,c.c)+'</span></div><div class="row"><span>အတိုး</span><span class="right">'+c.r+'% / လ</span></div><div class="row"><span>တစ်လအတိုး</span><span class="right">'+m(c.mon,c.c)+'</span></div><div class="row"><span>အတိုးမပေးသေးသောလ</span><span class="right red">'+c.unpaid+' လ</span></div><div class="row"><span>မပေးသေးသောလအတိုး</span><span class="right red">'+m(c.mon*c.unpaid,c.c)+'</span></div><div class="row"><span>မူရင်းကျန်</span><span class="right">'+m(c.rp,c.c)+'</span></div></div></div>'}).join(''):'<div class="empty">ဒီအမည်နဲ့ ချေးငွေစာရင်းမရှိသေးပါ။</div>')}
function showError(msg){document.getElementById('content').innerHTML='<div class="err">'+msg+'</div>'}
async function loadLive(){
  if(!token)return showError('Share Link မမှန်ပါ။');
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_salary_share',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_share_token:token})});
  if(!r.ok)throw new Error(await r.text());
  const rows=await r.json();
  if(!rows.length){showError('ဒီ Live Share Link ကို မတွေ့ပါ။ Owner က Share Link ကို အသစ်ပြန်လုပ်ပေးပါ။');return}
  const row=rows[0];
  if(row.updated_at!==lastUpdated){lastUpdated=row.updated_at;data=row.payload;document.getElementById('live').classList.remove('hidden');document.getElementById('updated').textContent='နောက်ဆုံး Update: '+new Date(row.updated_at).toLocaleString();render()}
}
async function boot(){
  if(token.includes('{')){data=legacyDec(token);render();return}
  try{await loadLive()}catch(e){console.error(e);showError('Live Share စာရင်းကို ရယူမရသေးပါ။ Internet connection ကို စစ်ပြီး ပြန်ဖွင့်ပါ။')}
  setInterval(()=>loadLive().catch(()=>{}),2000);
}
boot();
</script><script src="salary-enhancements.js?v=20260826-1"></script></body></html>
