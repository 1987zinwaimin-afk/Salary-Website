<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#6948ff"><title>အကြွေးစာရင်း</title><style>:root{--p:#6948ff;--p2:#a238ff;--blue:#1b9cff;--green:#12c985;--red:#ff3f68;--ink:#172033;--muted:#71809a;--bg:#070b18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#dffaff 0,#f4f0ff 42%,#e8e5ff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px 12px 42px}.head{display:flex;align-items:center;gap:10px;padding:5px 2px 10px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#a238ff,#6948ff);color:#fff;font-size:23px;box-shadow:0 8px 18px #6948ff40}.head h1{margin:0;font-size:20px}.head p{margin:2px 0;color:var(--muted);font-size:11px}.live{margin-left:auto;padding:6px 9px;border-radius:99px;background:#e5fff4;color:#0a9d66;font-size:10px;font-weight:900}.updated{text-align:right;color:var(--muted);font-size:10px;margin:0 2px 9px}.hero{padding:18px;border-radius:25px;color:#fff;background:linear-gradient(135deg,#5736ea,#9d39ff 52%,#078fe8);box-shadow:0 18px 38px #6338e63b}.hero .name{font-size:27px;font-weight:950}.hero .due{font-size:25px;font-weight:950;margin-top:5px}.hero .sub{opacity:.86;font-size:11px;margin-top:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card{background:#ffffffef;border:1px solid #e0e4ee;border-radius:18px;padding:12px;box-shadow:0 8px 22px #24304a10}.label{color:var(--muted);font-size:11px}.big{font-size:20px;font-weight:950;margin-top:3px}.notice{margin-top:10px;padding:12px 13px;border-radius:17px;color:#fff;background:linear-gradient(135deg,#ff9f1c,#ff4d67,#9a38ff);box-shadow:0 10px 24px #ff4d6730}.notice b{display:block;font-size:12px}.notice div{margin-top:4px;font-size:12px;line-height:1.5;white-space:pre-wrap}.tabs{display:flex;gap:9px;overflow-x:auto;padding:12px 1px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 125px;min-height:92px;padding:12px;border-radius:19px;border:1px solid #dedcf0;background:linear-gradient(145deg,#fff,#f5f0ff);box-shadow:0 8px 20px #4330a414;text-align:left;cursor:pointer;transition:.18s}.tab.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#5b38e8,#a238ff,#178fe9);transform:translateY(-2px);box-shadow:0 12px 25px #6841d044}.tab .ico{font-size:24px}.tab b{display:block;margin-top:3px;font-size:14px}.tab small{display:block;margin-top:5px;opacity:.8;font-size:10px}.detail{margin-top:2px;padding:16px;border-radius:23px;background:#fff;border:1px solid #e0e4ee;box-shadow:0 10px 28px #24304a12}.detailTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.type{font-size:20px;font-weight:950}.sub{font-size:11px;color:var(--muted);margin-top:2px}.remain{font-size:21px;font-weight:950;color:var(--red);text-align:right}.rows{margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf0f5;font-size:12px}.row:last-child{border-bottom:0}.right{text-align:right;font-weight:850}.red{color:var(--red)}.green{color:#0b9d65}.pay{width:100%;margin-top:12px;padding:13px;border:0;border-radius:15px;color:#fff;background:linear-gradient(135deg,#08ad75,#18d494,#168fe8);font-weight:950;font-size:14px;box-shadow:0 10px 24px #0cbd7b35;cursor:pointer}.warning{margin-top:10px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#fff1f4,#ffe5eb);border:1px solid #ffb7c5;color:#bf2946;box-shadow:0 7px 18px #ff496622;animation:float3d 2.5s ease-in-out infinite;transform-style:preserve-3d}.warning b{display:block;font-size:12px;line-height:1.55;text-shadow:0 1px 3px #fff}.empty{text-align:center;padding:35px 15px;background:#fff;border-radius:20px;color:var(--muted)}.err{padding:18px;background:#fff0f2;color:#c73750;border-radius:18px}.note{font-size:10px;color:#71809a;line-height:1.45;margin-top:12px;text-align:center}@keyframes float3d{0%,100%{transform:perspective(700px) rotateX(0) translateY(0)}50%{transform:perspective(700px) rotateX(3deg) translateY(-3px)}}#payModal{position:fixed;inset:0;background:rgba(12,14,35,.66);backdrop-filter:blur(7px);z-index:100;display:grid;place-items:center;padding:18px;animation:fadeIn .18s ease}.paySheet{width:min(430px,100%);border-radius:27px;padding:20px;background:linear-gradient(145deg,#fff,#f5f1ff);box-shadow:0 25px 70px #0007;animation:pop .22s cubic-bezier(.2,.9,.2,1)}.payIcon{width:62px;height:62px;border-radius:20px;margin:0 auto 9px;display:grid;place-items:center;font-size:32px;color:#fff;background:linear-gradient(145deg,#11cf8c,#188cf0,#8c3dff);box-shadow:7px 8px 0 #5135a21c}.paySheet h2{text-align:center;margin:0;font-size:21px}.paySub{text-align:center;color:var(--muted);font-size:11px;margin:5px 0 12px}.amountBox{display:flex;align-items:center;gap:8px;padding:3px 5px 3px 12px;border:2px solid #cfc5ff;border-radius:16px;background:#fff}.amountBox input{min-width:0;flex:1;border:0;outline:0;padding:12px 0;font-size:20px;font-weight:900;background:transparent}.currencyTag{padding:8px 10px;border-radius:11px;background:#eee9ff;color:#6841df;font-weight:950;font-size:11px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.quick button{padding:8px 3px;border:0;border-radius:11px;background:#eae7ff;color:#6340dc;font-weight:850;font-size:10px}.payWarn{margin-top:8px}.underWarn{padding:9px 10px;border-radius:12px;background:#fff0f2;color:#c83750;font-weight:800;font-size:11px}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.modalBtns button{padding:11px;border-radius:13px;border:0;font-weight:900}.cancel{background:#e9eaf0;color:#596174}.send{color:#fff;background:linear-gradient(135deg,#6948ff,#a238ff,#168fe8)}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}@media(max-width:500px){.wrap{padding:10px 10px 30px}.hero .name{font-size:24px}.grid{gap:7px}.tab{flex-basis:116px;min-height:88px}.detail{padding:13px}.remain{font-size:18px}.paySheet{padding:18px}.quick{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="wrap"><div class="head"><div class="logo">📒</div><div><h1>Salary Manager</h1><p>Shared Loan Statement</p></div><div id="live" class="live hidden">● LIVE</div></div><div id="updated" class="updated"></div><div id="content"></div><div class="note">Owner က Update လုပ်တိုင်း ဒီ Share Link က စာရင်းအသစ်ကို အလိုအလျောက် ပြန်ယူပေးပါတယ်။</div></div><script>const SUPABASE_URL='https://lsnmcdzupctwizxldjhc.supabase.co';const SUPABASE_KEY='sb_publishable_iJQ9BpS19OtdaYXM31J3ag_Mhljn8Xi';const token=location.hash.slice(1).trim();let current=null,activeIndex=0,lastUpdated='';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function n(x){return (+x||0).toLocaleString('en-US')}function m(x,c){return n(x)+' '+(c==='MMK'?'MMK':'THB')}function months(date){if(!date)return 0;const d=new Date(date+'T00:00:00'),now=new Date();let v=(now.getFullYear()-d.getFullYear())*12+now.getMonth()-d.getMonth();if(now.getDate()<d.getDate())v--;return Math.max(0,v)}function calc(l){const p=Math.max(0,+l.principal||0),r=Math.max(0,+l.rate||10),mon=p*r/100,elapsed=months(l.loanDate),ip=Math.max(0,+l.interestPaid||0),stop=Math.max(0,+l.interestStop||0),paidMonths=mon>0?Math.min(elapsed,Math.floor(ip/mon)):0,unpaid=Math.max(0,elapsed-paidMonths),accrued=mon*elapsed,due=Math.max(0,accrued-ip-stop),pp=Math.max(0,+l.principalPaid||0),rp=Math.max(0,p-pp),payments=(Array.isArray(l.payments)?l.payments:[]).reduce((a,x)=>a+(+x.amount||0),0),total=Math.max(0,rp+due-payments);return{p,r,mon,elapsed,paidMonths,unpaid,accrued,due,rp,payments,total,c:l.currency||'THB'}}function threeMisses(l){const expected=+l.monthlyPayment||0;if(expected<=0)return false;const pays=Array.isArray(l.payments)?l.payments:[],now=new Date();for(let i=0;i<3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1),sum=pays.filter(p=>{const x=new Date(p.createdAt||p.date||0);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()}).reduce((a,p)=>a+(+p.amount||0),0);if(sum>=expected)return false}return true}async function fetchShare(){if(!token)return null;const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_salary_share',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_share_token:token})});if(!r.ok)throw new Error(await r.text());const rows=await r.json();return rows[0]||null}async function recordView(row){const k='salary_view_recorded_'+token;if(sessionStorage.getItem(k))return;try{await fetch(SUPABASE_URL+'/rest/v1/rpc/record_salary_share_view',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_share_token:token,p_user_agent:navigator.userAgent,p_device_label:/iPhone|Android/i.test(navigator.userAgent)?'📱 Phone':'💻 Computer'})});sessionStorage.setItem(k,'1')}catch(e){}}function render(row){current=row;if(!row){document.getElementById('content').innerHTML='<div class="err">Share Link မမှန်ပါ သို့မဟုတ် စာရင်းမတွေ့ပါ။</div>';return}const loans=Array.isArray(row.payload?.loans)?row.payload.loans:[],cs=loans.map(calc),groups={MMK:{p:0,total:0},THB:{p:0,total:0}};cs.forEach(c=>{groups[c.c].p+=c.p;groups[c.c].total+=c.total});const name=row.person_name||row.payload?.name||'',notice=String(row.payload?.notice||'');let h=`<div class="hero"><div class="name">${esc(name)}</div><div class="due">လက်ကျန်စာရင်း</div><div class="sub">${loans.length} မျိုး · Live Share</div></div>`;if(notice)h+=`<div class="notice"><b>📢 Owner သတိပေးစာ</b><div>${esc(notice)}</div></div>`;h+=`<div class="grid"><div class="card"><div class="label">🇲🇲 မြန်မာငွေ</div><div class="big">${m(groups.MMK.total,'MMK')}</div></div><div class="card"><div class="label">🇹🇭 ထိုင်းငွေ</div><div class="big">${m(groups.THB.total,'THB')}</div></div></div>`;if(!loans.length){h+='<div class="empty" style="margin-top:10px">ဒီအမည်နဲ့ ချေးငွေစာရင်းမရှိသေးပါ။</div>'}else{h+='<div class="tabs">'+loans.map((l,i)=>`<button class="tab ${i===activeIndex?'active':''}" onclick="selectLoan(${i})"><span class="ico">💳</span><b>${esc(l.type||'Loan')}</b><small>${m(cs[i].total,cs[i].c)}</small></button>`).join('')+'</div>';const i=Math.min(activeIndex,loans.length-1),l=loans[i],c=cs[i];h+=`<div class="detail"><div class="detailTop"><div><div class="type">💳 ${esc(l.type||'Loan')}</div><div class="sub">${esc(l.loanDate||'')} · ${c.c}</div></div><div class="remain">${m(c.total,c.c)}</div></div><div class="rows"><div class="row"><span>မူရင်းချေးငွေ</span><span class="right">${m(c.p,c.c)}</span></div><div class="row"><span>တစ်လအတိုး</span><span class="right">${m(c.mon,c.c)}</span></div><div class="row"><span>လစဉ်သတ်မှတ်ငွေ</span><span class="right">${m(l.monthlyPayment||0,c.c)}</span></div><div class="row"><span>ပြန်ဆပ်ပြီးငွေ</span><span class="right green">${m(c.payments,c.c)}</span></div><div class="row"><span>လက်ကျန်</span><span class="right red">${m(c.total,c.c)}</span></div></div><button class="pay" onclick="openPayment(${i})">💸 ချေးငွေပြန်ဆပ်မည်</button>${(+l.monthlyPayment||0)>0&&c.total>0&&threeMisses(l)?`<div class="warning"><b>⚠️ လစဉ်သတ်မှတ်ငွေ 3 လဆက်တိုက် မပြည့်ပါက<br>အတိုးရပ်ထားသည်ကို ပြန်လည်ရပ်ဆိုင်းပြီး<br>အတိုးပြန်လည်သတ်မှတ်ပါမည်</b></div>`:''}</div>`}document.getElementById('content').innerHTML=h;document.getElementById('live').classList.remove('hidden');document.getElementById('updated').textContent='နောက်ဆုံး Update: '+new Date(row.updated_at||row.payload?.updatedAt||Date.now()).toLocaleString()}window.selectLoan=function(i){activeIndex=i;render(current)};window.openPayment=function(i){const l=current?.payload?.loans?.[i];if(!l)return;const c=calc(l),expected=+l.monthlyPayment||0;document.getElementById('payModal')?.remove();const x=document.createElement('div');x.id='payModal';x.innerHTML=`<div class="paySheet"><div class="payIcon">💸</div><h2>ချေးငွေပြန်ဆပ်မည်</h2><div class="paySub">${esc(l.type||'Loan')} · လက်ကျန် ${m(c.total,c.c)}</div><div class="amountBox"><input id="payAmount" type="number" min="1" step="any" placeholder="ပေးမည့်ငွေပမာဏ"><span class="currencyTag">${c.c}</span></div><div class="quick"><button onclick="quickPay(1000)">+1,000</button><button onclick="quickPay(5000)">+5,000</button><button onclick="quickPay(10000)">+10,000</button><button onclick="quickPay(50000)">+50,000</button></div><div id="payWarn" class="payWarn"></div><div class="modalBtns"><button class="cancel" onclick="closePay()">ပိတ်မည်</button><button class="send" id="sendPay">💾 ပေးချေမည်</button></div></div>`;x.onclick=e=>{if(e.target===x)closePay()};document.body.appendChild(x);const inp=document.getElementById('payAmount');inp.oninput=()=>{const a=+inp.value||0;document.getElementById('payWarn').innerHTML=expected>0&&a>0&&a<expected?`<div class="underWarn">⚠️ Owner သတ်မှတ်ငွေ ${m(expected,c.c)} ထက် လျော့သွင်းထားပါသည်။</div>`:''};document.getElementById('sendPay').onclick=async()=>{const a=+inp.value||0;if(a<=0)return alert('ငွေပမာဏထည့်ပါ');try{const paymentId=crypto.randomUUID();const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/submit_salary_payment',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_share_token:token,p_loan_id:String(l.id),p_payment_id:paymentId,p_amount:a,p_expected_monthly:expected})});if(!r.ok)throw new Error(await r.text());closePay();await refresh()}catch(e){alert('ငွေပေးချေမှု မအောင်မြင်သေးပါ။ ပြန်စမ်းပါ။')}}}window.quickPay=function(x){const i=document.getElementById('payAmount');i.value=(+i.value||0)+x;i.dispatchEvent(new Event('input'))};window.closePay=function(){document.getElementById('payModal')?.remove()};async function refresh(){try{const r=await fetchShare();if(r){current=r;render(r)}}catch(e){}}async function boot(){try{const row=await fetchShare();if(!row){render(null);return}render(row);await recordView(row)}catch(e){render(null)}setInterval(async()=>{try{const row=await fetchShare();if(!row)return;const sig=row.updated_at||'';if(sig!==lastUpdated){lastUpdated=sig;render(row)}}catch(e){}},2000)}boot();</script><script src="share-payment-approval-v3.js?v=20260827-1"></script><script src="payment-notification.js?v=20260827-2"></script></body></html>
