<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6948ff">
<title>Salary Manager — Shared Loan</title>
<style>
:root{--p:#6948ff;--p2:#a238ff;--b:#168fe8;--g:#12bd7b;--r:#e84b63;--ink:#172033;--muted:#71809a}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 0 0,#ddf8ff,#f5f6ff 48%,#eeeaff)}button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:14px 12px 40px}.head{display:flex;align-items:center;gap:10px}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:25px;background:linear-gradient(145deg,var(--p2),var(--p));box-shadow:7px 8px 0 #4930a522}.head h1{margin:0;font-size:21px}.head p{margin:2px 0;color:var(--muted);font-size:12px}.live{margin-left:auto;padding:7px 10px;border-radius:99px;background:#e5fff4;color:#0a9d66;font-size:10px;font-weight:900}.updated{color:var(--muted);font-size:10px;text-align:right;margin:8px 0}.hero{padding:20px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#5736ea,#9d39ff 52%,#078fe8);box-shadow:0 18px 40px #6338e63b}.heroName{font-size:27px;font-weight:950}.heroSub{margin-top:5px;font-size:12px;opacity:.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card,.detail,.notice,.empty,.err{border-radius:20px}.card{padding:14px;background:#ffffffef;border:1px solid #e0e4ee;box-shadow:0 8px 22px #24304a10}.label{font-size:11px;color:var(--muted)}.big{font-size:21px;font-weight:950;margin-top:4px}.notice{margin-top:10px;padding:14px;color:#fff;background:linear-gradient(135deg,#ff9f1c,#ff4d67,#9a38ff);box-shadow:0 10px 24px #ff4d6730}.notice b{font-size:13px}.notice div{margin-top:5px;font-size:12px;line-height:1.5;white-space:pre-wrap}.tabs{display:flex;gap:9px;overflow-x:auto;padding:12px 1px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 130px;min-height:92px;text-align:left;padding:12px;border-radius:19px;border:1px solid #dedcf0;background:linear-gradient(145deg,#fff,#f5f0ff);box-shadow:0 8px 20px #4330a414;cursor:pointer}.tab.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#5b38e8,#a238ff,#178fe9);transform:translateY(-2px)}.tab .ico{font-size:23px}.tab b{display:block;margin-top:3px;font-size:14px}.tab small{display:block;margin-top:5px;font-size:10px}.detail{padding:16px;background:#fff;border:1px solid #e0e4ee;box-shadow:0 10px 28px #24304a12}.detailTop{display:flex;justify-content:space-between;gap:10px}.type{font-size:20px;font-weight:950}.sub{font-size:11px;color:var(--muted);margin-top:2px}.remain{font-size:20px;font-weight:950;color:var(--r);text-align:right}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf0f5;font-size:12px}.right{text-align:right;font-weight:850}.pay{width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,#08ad75,#18d494,#168fe8);font-weight:950;box-shadow:0 10px 24px #0cbd7b35;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.pay:disabled{opacity:.65}.warning{margin-top:10px;padding:13px;border-radius:17px;background:linear-gradient(135deg,#fff1f4,#ffe5eb);border:1px solid #ffb7c5;color:#bf2946}.empty,.err{margin-top:10px;padding:28px 15px;background:#fff;text-align:center}.err{background:#fff0f2;color:#c73750;text-align:left}.note{margin-top:14px;text-align:center;color:var(--muted);font-size:10px;line-height:1.5}
#gate,#modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:#0c0e23b0;backdrop-filter:blur(8px)}.sheet{width:min(430px,100%);padding:20px;border-radius:27px;background:linear-gradient(145deg,#fff,#f5f1ff);box-shadow:0 25px 70px #0007}.sheet h2{text-align:center;margin:0;font-size:21px}.sheet p{text-align:center;color:var(--muted);font-size:11px;line-height:1.5}.sheet input{width:100%;padding:13px;border:2px solid #d7d0ff;border-radius:15px;outline:0;font-size:17px}.currency{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.currency button{padding:11px;border:0;border-radius:12px;background:#eef0f7;color:#687286;font-weight:900;cursor:pointer}.currency button.active{background:#e5f0ff;color:#1769ff;box-shadow:inset 0 0 0 2px #6b91ff}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.quick button{padding:8px 2px;border:0;border-radius:11px;background:#eae7ff;color:#6340dc;font-weight:850;font-size:10px}.info{margin-top:8px;padding:10px;border-radius:13px;background:#fff8df;border:1px solid #efd68c;color:#7b5a00;font-size:11px;line-height:1.5}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btns button{padding:12px;border:0;border-radius:13px;font-weight:900;cursor:pointer}.cancel{background:#e9eaf0;color:#596174}.send{color:#fff;background:linear-gradient(135deg,#6948ff,#a238ff,#168fe8)}.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(430px,calc(100% - 24px));z-index:200;padding:13px 15px;border-radius:16px;background:#fff;box-shadow:0 15px 45px #0003;border-left:5px solid var(--g);font-size:12px;font-weight:800}.spinner{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:500px){.wrap{padding:10px 10px 30px}.heroName{font-size:24px}.grid{gap:7px}.tab{flex-basis:116px}.detail{padding:13px}.remain{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">📒</div><div><h1>Salary Manager</h1><p>Shared Loan Statement</p></div><div id="live" class="live" style="display:none">● LIVE</div></div>
  <div id="updated" class="updated"></div>
  <div id="content"><div class="spinner">စာရင်းကို ရယူနေသည်…</div></div>
  <div class="note">Owner က Update လုပ်တိုင်း Share Link စာရင်းကို အလိုအလျောက် ပြန်ယူပေးပါတယ်။</div>
</div>
<script>
'use strict';
const SUPABASE_URL='https://lsnmcdzupctwizxldjhc.supabase.co';
const SUPABASE_KEY='sb_publishable_iJQ9BpS19OtdaYXM31J3ag_Mhljn8Xi';
const qs=new URLSearchParams(location.search);
const token=(location.hash.slice(1).trim()||qs.get('token')||qs.get('share')||'').trim();
let current=null,active=0,payCurrency='MMK',pollTimer=null,lastSig='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('en-US');
const money=(n,c)=>(fmt(n)+' '+(c==='MMK'?'MMK':'THB'));
const viewerKey='salary_share_viewer_name_v1';
const viewerName=()=>String(localStorage.getItem(viewerKey)||'').trim();
const setViewerName=n=>localStorage.setItem(viewerKey,String(n||'').trim());
const deviceLabel=()=>{const u=navigator.userAgent||'';const os=/Windows/i.test(u)?'Windows':/Android/i.test(u)?'Android':/iPhone|iPad/i.test(u)?'iPhone/iPad':/Mac/i.test(u)?'Mac':'Browser';const b=/Edg\//i.test(u)?'Edge':/Chrome\//i.test(u)?'Chrome':/Firefox\//i.test(u)?'Firefox':/Safari\//i.test(u)?'Safari':'Browser';return b+' / '+os};
async function rpc(name,body){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function calc(l){const principal=Math.max(0,+l.principal||0),rate=Math.max(0,+l.rate||10),monthlyInterest=principal*rate/100,interestPaid=Math.max(0,+l.interestPaid||0),interestStop=Math.max(0,+l.interestStop||0),principalPaid=Math.max(0,+l.principalPaid||0),payments=(Array.isArray(l.payments)?l.payments:[]).reduce((a,p)=>a+(+p.amount||0),0);let months=0;if(l.loanDate){const d=new Date(l.loanDate+'T00:00:00'),n=new Date();months=Math.max(0,(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth()-(n.getDate()<d.getDate()?1:0))}const accrued=monthlyInterest*months,interestDue=Math.max(0,accrued-interestPaid-interestStop),principalDue=Math.max(0,principal-principalPaid),total=Math.max(0,principalDue+interestDue-payments);return{principal,rate,monthlyInterest,months,interestPaid,interestStop,principalPaid,payments,interestDue,principalDue,total,c:l.currency||'MMK'}}
function threeMisses(l){const expected=+l.monthlyPayment||0;if(expected<=0)return false;const pays=Array.isArray(l.payments)?l.payments:[],now=new Date();for(let i=0;i<3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const sum=pays.filter(p=>{const x=new Date(p.createdAt||p.date||0);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()}).reduce((a,p)=>a+(+p.amount||0),0);if(sum>=expected)return false}return true}
function showError(msg){$('content').innerHTML='<div class="err"><b>❌ Share Link စာရင်းဖွင့်မရပါ</b><br><br>'+esc(msg)+'</div>'}
async function getShare(){const rows=await rpc('get_salary_share',{p_share_token:token});return Array.isArray(rows)&&rows[0]?rows[0]:null}
async function recordView(){if(!token||!viewerName())return;const k='salary_view_recorded_v4_'+token+'_'+viewerName();if(sessionStorage.getItem(k))return;try{await rpc('record_salary_share_view_v2',{p_share_token:token,p_viewer_name:viewerName(),p_device_label:deviceLabel(),p_user_agent:navigator.userAgent||''});sessionStorage.setItem(k,'1')}catch(e){console.warn(e)}}
function askName(){if(viewerName())return Promise.resolve();return new Promise(resolve=>{const d=document.createElement('div');d.id='gate';d.innerHTML='<div class="sheet"><h2>👤 စာရင်းကြည့်သူအမည်</h2><p>Owner Notification မှာ သင်ဘယ်သူစာရင်းဝင်ကြည့်နေတယ်ဆိုတာ ပြရန် အမည်ထည့်ပါ။</p><input id="vn" placeholder="ဥပမာ — Zin Min Thu"><button id="vs" class="pay" type="button">ဆက်မည်</button></div>';$('content').after(d);$('vs').addEventListener('click',()=>{const n=$('vn').value.trim();if(!n)return alert('အမည်ထည့်ပါ');setViewerName(n);d.remove();resolve()},{once:true})})}
function render(row){current=row;if(!row){showError('ဒီ Share Link token နဲ့ စာရင်းမတွေ့ပါ။ Owner ဆီက Share Link အသစ်ကို ပြန်ယူပါ။');return}const loans=Array.isArray(row.payload?.loans)?row.payload.loans:[],cs=loans.map(calc),mmk=cs.filter(x=>x.c==='MMK').reduce((a,x)=>a+x.total,0),thb=cs.filter(x=>x.c==='THB').reduce((a,x)=>a+x.total,0);$('live').style.display='block';$('updated').textContent=row.updated_at?'Updated '+new Date(row.updated_at).toLocaleString():'LIVE';let h='<div class="hero"><div class="heroName">'+esc(row.person_name||row.payload?.name||'Shared Loan')+'</div><div class="heroSub">'+loans.length+' မျိုး · Live Share</div></div>';if(row.payload?.notice)h+='<div class="notice"><b>📢 Owner သတိပေးစာ</b><div>'+esc(row.payload.notice)+'</div></div>';h+='<div class="grid"><div class="card"><div class="label">🇲🇲 မြန်မာငွေ</div><div class="big">'+money(mmk,'MMK')+'</div></div><div class="card"><div class="label">🇹🇭 ထိုင်းငွေ</div><div class="big">'+money(thb,'THB')+'</div></div></div>';if(!loans.length){h+='<div class="empty">ချေးငွေစာရင်းမရှိသေးပါ။</div>'}else{h+='<div class="tabs">'+loans.map((l,i)=>'<button type="button" class="tab '+(i===active?'active':'')+'" data-loan-index="'+i+'"><span class="ico">💳</span><b>'+esc(l.type||'Loan')+'</b><small>'+money(cs[i].total,cs[i].c)+'</small></button>').join('')+'</div>';const i=Math.min(active,loans.length-1),l=loans[i],c=cs[i];h+='<div class="detail"><div class="detailTop"><div><div class="type">💳 '+esc(l.type||'Loan')+'</div><div class="sub">'+esc(l.loanDate||'')+' · '+c.c+'</div></div><div class="remain">'+money(c.total,c.c)+'</div></div><div style="margin-top:10px">';[['မူရင်းချေးငွေ',money(c.principal,c.c)],['တစ်လအတိုး',money(c.monthlyInterest,c.c)],['အတိုးလက်ကျန်',money(c.interestDue,c.c)],['မူရင်းလက်ကျန်',money(c.principalDue,c.c)],['လစဉ်သတ်မှတ်ငွေ',money(+l.monthlyPayment||0,c.c)],['အတည်ပြုပြီးပေးချေထားပြီး',money(c.payments,c.c)]].forEach(x=>h+='<div class="row"><span>'+x[0]+'</span><span class="right">'+x[1]+'</span></div>');h+='</div>';if(threeMisses(l))h+='<div class="warning"><b>⚠️ လစဉ်သတ်မှတ်ငွေ 3 လဆက်တိုက် မပြည့်ပါက အတိုးရပ်ထားသည်ကို ပြန်လည်ရပ်ဆိုင်းပြီး အတိုးပြန်လည်သတ်မှတ်ပါမည်။</b></div>';h+='<button class="pay" type="button" id="sharePayBtn">💸 ချေးငွေပြန်ဆပ်မည်</button></div>'}$('content').innerHTML=h;$('content').querySelectorAll('[data-loan-index]').forEach(b=>b.addEventListener('click',()=>{active=Number(b.dataset.loanIndex)||0;render(current)}));const pb=$('sharePayBtn');if(pb)pb.addEventListener('click',()=>openPay());}
function openPay(){const loans=Array.isArray(current?.payload?.loans)?current.payload.loans:[],l=loans[Math.min(active,loans.length-1)];if(!l)return;payCurrency=l.currency||'MMK';const c=calc(l);const d=document.createElement('div');d.id='modal';d.innerHTML='<div class="sheet"><h2>💸 ချေးငွေပြန်ဆပ်ရန်</h2><p><b>'+esc(l.type||'Loan')+'</b><br>ငွေထည့်ပြီး Request ပို့ပါ။ <b>Owner လက်ခံမှသာ</b> စာရင်းလျော့ပါမည်။</p><div class="currency"><button type="button" id="mmk">🇲🇲 မြန်မာငွေ MMK</button><button type="button" id="thb">🇹🇭 ထိုင်းငွေ THB</button></div><input id="amt" type="number" min="1" step="any" inputmode="decimal" placeholder="ပေးချေမည့်ငွေအမောက်ထည့်ပါ"><div class="quick"><button type="button" data-add="1000">+1,000</button><button type="button" data-add="5000">+5,000</button><button type="button" data-add="10000">+10,000</button><button type="button" data-add="50000">+50,000</button></div><div class="info">ချေးငွေငွေကြေး: <b>'+esc(c.c)+'</b><br>လက်ကျန်: <b>'+money(c.total,c.c)+'</b><br>သတ်မှတ်ငွေ: <b>'+money(+l.monthlyPayment||0,c.c)+'</b><br><br>🔒 Request ပို့ပြီး Owner Approval မရမချင်း မည်သည့်လက်ကျန်မှ မလျော့ပါ။</div><div class="btns"><button class="cancel" type="button" id="close">ပိတ်မည်</button><button class="send" type="button" id="send">📨 Request ပို့မည်</button></div></div>';$('content').after(d);const setCur=x=>{payCurrency=x;$('mmk').classList.toggle('active',x==='MMK');$('thb').classList.toggle('active',x==='THB')};setCur(payCurrency);$('mmk').addEventListener('click',()=>setCur('MMK'));$('thb').addEventListener('click',()=>setCur('THB'));$('close').addEventListener('click',()=>d.remove());d.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{const x=$('amt');x.value=(+x.value||0)+(+b.dataset.add||0)}));$('send').addEventListener('click',async()=>{const amount=+$('amt').value||0;if(amount<=0){alert('ပေးချေမည့်ငွေအမောက်ထည့်ပါ');return}if(payCurrency!==c.c){alert('ဒီချေးငွေအတွက် '+c.c+' ကိုသာ ရွေးပေးပါ');return}const b=$('send');b.disabled=true;b.textContent='⏳ Request ပို့နေသည်…';try{await rpc('submit_salary_payment_request',{p_share_token:token,p_loan_id:String(l.id),p_payer_name:viewerName()||'Guest',p_amount:amount,p_currency:payCurrency,p_device_label:deviceLabel()});d.remove();toast('📨 Owner ဆီ Approval Request ပို့ပြီးပါပြီ။ Owner လက်ခံမှသာ စာရင်းလျော့ပါမည်။')}catch(e){b.disabled=false;b.textContent='📨 Request ပို့မည်';alert('Request ပို့မရပါ။ '+String(e.message||e))}})}
function toast(msg,ok=true){const x=document.createElement('div');x.className='toast';x.style.borderLeftColor=ok?'#18b978':'#ef4760';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),5000)}
async function poll(){try{const row=await getShare();const sig=row?String(row.updated_at)+'|'+JSON.stringify(row.payload||{}):'none';if(sig!==lastSig){lastSig=sig;render(row)}if(row){const ns=await rpc('get_salary_share_notifications',{p_share_token:token,p_viewer_name:viewerName()||'Guest'});const list=Array.isArray(ns)?ns:[];const latest=list.filter(n=>n.type==='payment_approved'||n.type==='payment_rejected').sort((a,b)=>new Date(b.created_at||b.createdAt||0)-new Date(a.created_at||a.createdAt||0))[0];if(latest){const k='salary_share_notice_v4_'+token;if(localStorage.getItem(k)!==String(latest.id)){localStorage.setItem(k,String(latest.id));toast(latest.type==='payment_approved'?'✅ Owner က လက်ခံပြီးပါပြီ။ စာရင်းလျော့ပြီးပါပြီ။':'❌ Owner က Request ကို ငြင်းပယ်လိုက်ပါပြီ။',latest.type==='payment_approved')}}}}catch(e){console.error(e);if(!current)showError('Database ဆက်သွယ်ရာမှာ ပြဿနာရှိနေပါတယ်။ '+String(e.message||e))}}
async function boot(){if(!token){showError('Share Link ထဲက token မပါသေးပါ။ Owner က ပေးထားတဲ့ Share Link အပြည့်အစုံကို ဖွင့်ပါ။');return}try{await askName();await recordView();await poll();clearInterval(pollTimer);pollTimer=setInterval(poll,5000)}catch(e){console.error(e);showError('Share Link ကို ဖွင့်ရာမှာ ပြဿနာဖြစ်နေပါတယ်။ '+String(e.message||e))}}
window.openPay=openPay;
boot();
</script>
</body>
</html>
