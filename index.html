<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary System</title>

<style>
body{
font-family:Arial;
margin:0;
padding:0;
background:#f1f5f9;
}

.loginPage{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.loginBox{
background:white;
padding:30px;
border-radius:15px;
width:320px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
text-align:center;
}

.loginBox img{
width:100px;
margin-bottom:10px;
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;
margin-top:10px;
}

.main{
display:none;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
margin-top:15px;
}

.day{
padding:12px;
background:white;
text-align:center;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.present{
background:#2563eb;
color:white;
}

.absent{
background:red;
color:white;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

.settings{
background:white;
padding:15px;
border-radius:10px;
margin-top:20px;
}

@media(max-width:700px){
.calendar{
grid-template-columns:repeat(4,1fr);
}
}
</style>
</head>

<body>

<div class="loginPage" id="loginPage">
<div class="loginBox">

<img id="logoPreview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h2 id="loginText">Login</h2>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>
</div>

<div class="main" id="mainPage">

<div class="topbar">

<div>
<h2 id="title">Salary System</h2>

<select id="language" onchange="changeLanguage()">
<option value="en">English</option>
<option value="mm">မြန်မာ</option>
</select>
</div>

<div>
<select id="employee" onchange="loadEmployee()">
<option>Zin Wai Min</option>
<option>Khom</option>
<option>Zin Min Thu</option>
</select>

<select id="month">
<option>January 2026</option>
<option>February 2026</option>
<option>March 2026</option>
<option>April 2026</option>
<option>May 2026</option>
<option>June 2026</option>
<option>July 2026</option>
<option>August 2026</option>
<option>September 2026</option>
<option>October 2026</option>
<option>November 2026</option>
<option>December 2026</option>
</select>
</div>

</div>

<h3 id="attendanceText">Attendance</h3>

<div class="calendar" id="calendar"></div>

<table>
<thead>
<tr>
<th id="nameText">Name</th>
<th id="presentText">Present</th>
<th id="absentText">Absent</th>
<th id="salaryText">Salary</th>
<th id="roomText">Room</th>
<th id="foodText">Food</th>
<th id="debtText">Debt</th>
<th id="fuelText">Fuel</th>
<th id="otherText">Other</th>
<th id="finalText">Final</th>
<th>Edit</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<div class="settings">

<h3 id="settingText">Settings</h3>

<input type="text" id="newUser" placeholder="New Username">
<input type="password" id="newPass" placeholder="New Password">

<input type="text" id="logoInput" placeholder="Logo Image URL">

<button onclick="saveSettings()">Save Settings</button>

</div>

</div>

<script>

let employees = JSON.parse(localStorage.getItem("employees")) || {

"Zin Wai Min":{
present:0,
absent:0,
salaryPerDay:500,
salary:0,
room:0,
food:0,
debt:0,
fuel:0,
other:0,
days:[]
},

"Khom":{
present:0,
absent:0,
salaryPerDay:700,
salary:0,
room:0,
food:0,
debt:0,
fuel:0,
other:0,
days:[]
},

"Zin Min Thu":{
present:0,
absent:0,
salaryPerDay:1000,
salary:0,
room:0,
food:0,
debt:0,
fuel:0,
other:0,
days:[]
}

};

function saveData(){
localStorage.setItem("employees",JSON.stringify(employees));
}

function currentEmployee(){
return document.getElementById("employee").value;
}

function createCalendar(){

let calendar=document.getElementById("calendar");
calendar.innerHTML="";

let emp=currentEmployee();

for(let i=1;i<=31;i++){

let day=document.createElement("div");
day.className="day";
day.innerText=i;

if(employees[emp].days.includes(i)){
day.classList.add("present");
}

day.onclick=function(){

let index=employees[emp].days.indexOf(i);

if(index>-1){

employees[emp].days.splice(index,1);

}else{

employees[emp].days.push(i);

}

updateEmployee(emp);

createCalendar();

};

calendar.appendChild(day);

}

}

function updateEmployee(name){

let e=employees[name];

e.present=e.days.length;

e.absent=31-e.present;

e.salary=e.present*e.salaryPerDay;

saveData();

renderTable();

}

function renderTable(){

let body=document.getElementById("tableBody");

body.innerHTML="";

for(let name in employees){

let e=employees[name];

let final=
e.salary-
e.room-
e.food-
e.debt-
e.fuel-
e.other;

body.innerHTML+=`

<tr>

<td>${name}</td>

<td>${e.present}</td>

<td>${e.absent}</td>

<td contenteditable
oninput="editValue('${name}','salaryPerDay',this.innerText)">
${e.salaryPerDay}
</td>

<td contenteditable
oninput="editValue('${name}','room',this.innerText)">
${e.room}
</td>

<td contenteditable
oninput="editValue('${name}','food',this.innerText)">
${e.food}
</td>

<td contenteditable
oninput="editValue('${name}','debt',this.innerText)">
${e.debt}
</td>

<td contenteditable
oninput="editValue('${name}','fuel',this.innerText)">
${e.fuel}
</td>

<td contenteditable
oninput="editValue('${name}','other',this.innerText)">
${e.other}
</td>

<td>${final}</td>

<td>
<button onclick="editName('${name}')">
Edit
</button>
</td>

<td>
<button onclick="deleteUser('${name}')">
Delete
</button>
</td>

</tr>

`;

}

}

function editValue(name,key,value){

employees[name][key]=Number(value)||0;

updateEmployee(name);

saveData();

}

function editName(oldName){

let newName=prompt("New Name",oldName);

if(newName){

employees[newName]=employees[oldName];

delete employees[oldName];

saveData();

renderTable();

}

}

function deleteUser(name){

if(confirm("Delete?")){

delete employees[name];

saveData();

renderTable();

}

}

document.getElementById("employee")
.onchange=function(){

createCalendar();

renderTable();

};

createCalendar();

renderTable();

</script>

</body>
</html>
