<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6948ff"><title>Salary Manager</title>
<style>
:root{--p:#6948ff;--p2:#9a55ff;--c:#13c9ee;--ink:#172033;--muted:#738096;--green:#19b978;--red:#f04b63;--yellow:#d89500;--purple:#7447df;--bg:#f5f6ff;--shadow:0 14px 35px rgba(48,37,120,.13)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#ddf8ff,#f5f6ff 42%,#eeeaff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{border:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative;overflow:hidden}.orb{position:absolute;border-radius:50%;animation:float 5s ease-in-out infinite}.o1{width:190px;height:190px;background:#a86aff;left:-65px;top:-55px}.o2{width:145px;height:145px;background:#1bd9ef;right:-45px;bottom:80px}.loginbox{width:min(420px,100%);background:#ffffffdd;backdrop-filter:blur(20px);padding:30px;border-radius:32px;box-shadow:0 30px 70px #35218b30;text-align:center;position:relative;z-index:1}.logo,.brandicon{display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--p2),var(--p));box-shadow:8px 9px 0 #4930a522,0 20px 35px #6948ff44}.logo{width:92px;height:92px;border-radius:28px;margin:auto auto 15px;font-size:45px;animation:float 3s ease-in-out infinite}h1{margin:0 0 6px}.sub,.muted{color:var(--muted)}.field,.control{width:100%;padding:13px 14px;border:1px solid #dfe3ef;border-radius:14px;background:#fff;outline:0}.field{margin:6px 0}.primary,.bigbtn{width:100%;padding:14px;border-radius:15px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));font-weight:800;box-shadow:0 10px 22px #6948ff35;margin-top:8px}.hint{font-size:12px;color:#8a91a5;margin-top:12px}@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
.app{max-width:900px;margin:auto;padding:10px 12px 90px}.top{position:sticky;top:0;z-index:20;padding:6px 0 10px;background:#f5f6ffe8;backdrop-filter:blur(14px)}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brandicon{width:44px;height:44px;border-radius:14px;font-size:22px}.brand b{font-size:17px}.brand small{display:block;color:var(--muted)}.menuBtn,.close{width:45px;height:45px;border-radius:15px;background:#fff;box-shadow:var(--shadow);font-size:22px}.pageTitle{margin:15px 2px 12px}.pageTitle h2{margin:0;font-size:24px}.pageTitle p{margin:4px 0;color:var(--muted);font-size:13px}.hero{padding:20px;border-radius:27px;color:#fff;background:linear-gradient(135deg,#5c3ee7,#8c4dff 50%,#13c9ee);box-shadow:0 20px 45px #5c3ee73b}.amount{font-size:34px;font-weight:900}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.card{background:#ffffffdf;border:1px solid #fff;border-radius:21px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-size:25px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.purple{color:var(--purple)}.section{margin-top:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.sectionhead h3{margin:0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary b{display:block;font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{min-height:75px;border-radius:15px;border:2px solid #e5e8f0;background:#fff;padding:6px;text-align:center;cursor:pointer}.day .dow{font-size:10px;color:#8790a4}.day strong{display:block;font-size:17px}.day .status{font-size:9px;font-weight:800}.attend{background:#eaf2ff;border-color:#4f8cff;color:#1769ff}.absent{background:#ffe8ed;border-color:#ff6178;color:#e42f4b}.off{background:#fff5d8;border-color:#ffc84a;color:#a56d00}.leave{background:#f0eaff;border-color:#8c69ee;color:#7048dc}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.pill{padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800}.pa{background:#e5f0ff;color:#1769ff}.px{background:#ffe7eb;color:#e42f4b}.po{background:#fff4d6;color:#b77800}.pl{background:#eee8ff;color:#7048dc}.danger{background:#ffe7eb!important;color:#df3450!important}.menu{position:fixed;inset:0;background:#10112055;backdrop-filter:blur(5px);z-index:50}.drawer{margin-left:auto;width:min(350px,88vw);height:100%;background:#fff;border-radius:28px 0 0 28px;padding:22px;box-shadow:-20px 0 55px #0003}.mi{width:100%;display:flex;align-items:center;gap:12px;padding:15px;border-radius:16px;background:#f6f7fb;margin:8px 0;text-align:left;font-weight:800}.mi span{font-size:22px}.modal{position:fixed;inset:0;background:#10112066;backdrop-filter:blur(6px);z-index:60;display:grid;place-items:end}.sheet{width:min(650px,100%);background:#fff;border-radius:28px 28px 0 0;padding:22px;max-height:94vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{box-shadow:none;background:#f0f1f6}.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(700px,calc(100% - 20px));background:#ffffffed;backdrop-filter:blur(16px);border-radius:22px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 15px 40px #34217a22;z-index:25}.nav{padding:8px 2px;border-radius:15px;background:transparent;color:#687286;font-size:10px;font-weight:800}.nav.active{background:#eee9ff;color:#6540dc}.nav span{display:block;font-size:19px;margin-bottom:2px}.loan{cursor:pointer;border:2px solid #eee9ff;background:linear-gradient(135deg,#fff,#f7f4ff)}.loan b{font-size:18px}.borrower{margin-top:10px}.smallbtn{padding:10px 12px;border-radius:12px;background:#eee9ff;color:#6540dc;font-weight:800}.dangerbtn{background:#ffe7eb;color:#df3450}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{padding:12px;border-radius:15px;background:#f7f8fc}.kpi b{display:block;font-size:17px;margin-top:4px}.note{font-size:12px;color:var(--muted);line-height:1.5}.formrow{margin:9px 0}.formrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.table{width:100%;border-collapse:collapse;font-size:12px}.table td{padding:9px 4px;border-bottom:1px solid #eee}.right{text-align:right}@media(min-width:701px){.stats{grid-template-columns:repeat(4,1fr)}.modal{place-items:center}.sheet{border-radius:28px}}
</style></head><body>
<div id="loginPage" class="login"><div class="orb o1"></div><div class="orb o2"></div><div class="loginbox"><div class="logo">💰</div><h1>Salary Manager</h1><p class="sub">လစာ၊ Attendance နဲ့ အကြွေးစာရင်း</p><input id="u" class="field" placeholder="Username"><input id="pw" class="field" type="password" placeholder="Password"><button class="primary" onclick="login()">🔐 Login ဝင်မည်</button><div class="hint">ပထမဆုံးအသုံးပြုရန် — admin / 1234</div></div></div>
<div id="app" class="hidden"><div class="app"><header class="top"><div class="toprow"><div class="brand"><div class="brandicon">💰</div><div><b>Salary Manager</b><small id="topSub">Dashboard</small></div></div><button class="menuBtn" onclick="openMenu()">☰</button></div></header><main id="main"></main></div><nav class="bottom"><button class="nav" data-page="dashboard" onclick="go('dashboard')"><span>🏠</span>Dashboard</button><button class="nav" data-page="attendance" onclick="go('attendance')"><span>📅</span>Attendance</button><button class="nav" data-page="salary" onclick="go('salary')"><span>💰</span>လစာ</button><button class="nav" data-page="debt" onclick="go('debt')"><span>📒</span>အကြွေး</button><button class="nav" data-page="settings" onclick="go('settings')"><span>⚙️</span>Settings</button></nav></div>
<div id="menu" class="menu hidden" onclick="if(event.target.id==='menu')closeMenu()"><aside class="drawer"><div class="toprow"><h2>☰ Menu</h2><button class="close" onclick="closeMenu()">×</button></div><p class="muted">Menu မှာ Logout တစ်ခုပဲရှိပါတယ်</p><button class="mi danger" onclick="logout()"><span>🚪</span>Logout</button></aside></div><div id="modal" class="modal hidden"></div>
<script>
const EMP=['Zin Wai Min','Khom','Zin Min Thu'],KEY='salary_manager_v3';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{user:'admin',pass:'1234',employee:EMP[0],daily:500,period:'2026-08',records:{},extra:0,deductions:0,debts:[]};S.debts=S.debts||[];let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function login(){if(u.value===S.user&&pw.value===S.pass){localStorage.setItem('salary_session','1');showApp()}else alert('Username သို့မဟုတ် Password မမှန်ပါ')}function logout(){localStorage.removeItem('salary_session');app.classList.add('hidden');loginPage.classList.remove('hidden');closeMenu()}function showApp(){loginPage.classList.add('hidden');app.classList.remove('hidden');go(page)}function openMenu(){menu.classList.remove('hidden')}function closeMenu(){menu.classList.add('hidden')}function go(p){page=p;render();scrollTo({top:0,behavior:'smooth'})}
function periodDates(){let[y,m]=S.period.split('-').map(Number),a=[],d=new Date(y,m-1,26),e=new Date(y,m,25);for(;d<=e;d.setDate(d.getDate()+1))a.push(new Date(d));return a}function recKey(d){return S.employee+'_'+S.period+'_'+d.toISOString().slice(0,10)}function status(d){return S.records[recKey(d)]||''}function counts(){let c={attend:0,absent:0,off:0,leave:0};periodDates().forEach(d=>{let x=status(d);if(x)c[x]++});return c}function calc(){let c=counts(),base=c.attend*+S.daily;return{...c,base,final:Math.max(0,base+(+S.extra||0)-(+S.deductions||0))}}function fmt(n){return (+n||0).toLocaleString('en-US')}
function head(t,s){return `<div class="pageTitle"><h2>${t}</h2><p>${s}</p></div>`}function empSelect(){return `<select id="emp" class="control">${EMP.map(x=>`<option ${x===S.employee?'selected':''}>${x}</option>`).join('')}</select>`}
function render(){topSub.textContent={dashboard:'Dashboard',attendance:'Attendance',salary:'လစာတွက်ချက်မှု',debt:'အကြွေးစာရင်း',settings:'Settings'}[page];document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));main.innerHTML=page==='dashboard'?dashboardPage():page==='attendance'?attendancePage():page==='salary'?salaryPage():page==='debt'?debtPage():settingsPage();bind()}
function dashboardPage(){let c=calc();return head('🏠 Dashboard','လစာအခြေအနေကို တစ်ချက်ကြည့်ရန်')+`<section class="hero"><small>ရရှိမည့်လစာ</small><div class="amount">${fmt(c.final)} THB</div><div class="row"><div><small>ဝန်ထမ်း</small>${empSelect()}</div><div><small>လစာကာလ</small><input id="period" class="control" type="month" value="${S.period}"></div></div></section><div class="stats"><div class="card stat">🔵<span class="muted">အလုပ်ဆင်း</span><b class="green">${c.attend}</b>ရက်</div><div class="card stat">🔴<span class="muted">ပျက်ရက်</span><b class="red">${c.absent}</b>ရက်</div><div class="card stat">🟡<span class="muted">နားရက်</span><b class="yellow">${c.off}</b>ရက်</div><div class="card stat">🟣<span class="muted">ခွင့်</span><b class="purple">${c.leave}</b>ရက်</div></div><div class="section card"><h3>📒 အကြွေးစာရင်း</h3><p>ချေးငွေယူသူ ${borrowers().length} ယောက် · ချေးငွေ ${S.debts.length} ခု</p><button class="bigbtn" onclick="go('debt')">အကြွေးစာရင်းကြည့်မည် →</button></div>`}
function attendancePage(){let days=periodDates();return head('📅 Attendance','ရက်တစ်ရက်ချင်းနှိပ်ပြီး အလုပ်ဆင်း / ပျက် / နား / ခွင့် သတ်မှတ်ပါ')+`<div class="card"><div class="row"><div><label class="muted">ဝန်ထမ်း</label>${empSelect()}</div><div><label class="muted">လစာကာလ</label><input id="period" class="control" type="month" value="${S.period}"></div></div><div class="legend"><span class="pill pa">🔵 အလုပ်ဆင်း</span><span class="pill px">🔴 ပျက်</span><span class="pill po">🟡 နား</span><span class="pill pl">🟣 ခွင့်</span></div></div><div class="section"><div class="calendar">${days.map(d=>{let x=status(d),lab={attend:'အလုပ်ဆင်း',absent:'ပျက်',off:'နား',leave:'ခွင့်'}[x]||'';return `<button class="day ${x}" onclick="pick('${d.toISOString().slice(0,10)}')"><span class="dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}</span><strong>${d.getDate()}/${d.getMonth()+1}</strong><span class="status">${lab}</span></button>`}).join('')}</div></div>`}
function salaryPage(){let c=calc();return head('💰 လစာတွက်ချက်မှု','တစ်ရက်လစာ၊ OT၊ နုတ်ငွေ ပြင်ရန်')+`<div class="card">${empSelect()}<div class="row"><div><label class="muted">တစ်ရက်လစာ</label><input id="daily" class="control" type="number" value="${S.daily}"></div><div><label class="muted">လစာကာလ</label><input id="period" class="control" type="month" value="${S.period}"></div></div><div class="row"><div><label class="muted">အပိုငွေ / OT</label><input id="extra" class="control" type="number" value="${S.extra}"></div><div><label class="muted">နုတ်ငွေ</label><input id="deductions" class="control" type="number" value="${S.deductions}"></div></div><button class="bigbtn" onclick="saveSalary()">💾 သိမ်းမည်</button></div><div class="section card"><h3>📊 အသေးစိတ်</h3><p>အလုပ်ဆင်း ${c.attend} ရက် × ${fmt(S.daily)} = <b>${fmt(c.base)} THB</b></p><p>အပိုငွေ = ${fmt(S.extra)} THB</p><p>နုတ်ငွေ = ${fmt(S.deductions)} THB</p><h2 class="green">ရရှိမည့်လစာ — ${fmt(c.final)} THB</h2></div>`}
function settingsPage(){return head('⚙️ Settings','Username / Password ပြောင်းရန်')+`<div class="card"><h3>👤 Login Account</h3><label class="muted">Username အသစ်</label><input id="newUser" class="control" value="${S.user}"><label class="muted">Password အသစ်</label><input id="newPass" class="control" type="password"><label class="muted">Password ပြန်ရိုက်ပါ</label><input id="newPass2" class="control" type="password"><button class="bigbtn" onclick="changeAccount()">🔐 သိမ်းမည်</button></div>`}
function borrowers(){return [...new Set(S.debts.map(x=>x.borrower))]}
function loanCalc(l){let principal=Math.max(0,+l.principal||0),rate=+l.rate||10,months=Math.max(0,+l.unpaidMonths||0),monthly=principal*rate/100,accrued=monthly*months,interestPaid=+l.interestPaid||0,stop=+l.interestStop||0,outInterest=Math.max(0,accrued-interestPaid-stop),principalPaid=+l.principalPaid||0,remainPrincipal=Math.max(0,principal-principalPaid);return{monthly,accrued,interestPaid,stop,outInterest,remainPrincipal,total:remainPrincipal+outInterest}}
function debtPage(){let bs=borrowers();return head('📒 အကြွေးစာရင်း','တစ်ယောက်တည်းမှာ ချေးငွေအမျိုးအစား ၅ မျိုးနှင့်အထက် ထည့်နိုင်ပါတယ်')+`<div class="card"><button class="bigbtn" onclick="addBorrower()">＋ ချေးငွေယူသူအသစ်ထည့်မည်</button><p class="note">အတိုးကို တစ်လ 10% အဖြစ်တွက်ထားပါတယ်။ ဥပမာ 20,000 THB ဆို တစ်လအတိုး 2,000 THB ဖြစ်ပါတယ်။</p></div>${bs.map(b=>borrowerBlock(b)).join('')||`<div class="section card"><h3>အကြွေးစာရင်း မရှိသေးပါ</h3><p class="muted">အပေါ်က ချေးငွေယူသူအသစ်ထည့်ရန် ခလုတ်ကိုနှိပ်ပါ။</p></div>`}`}
function borrowerBlock(b){let loans=S.debts.filter(x=>x.borrower===b),total=loans.reduce((a,l)=>a+loanCalc(l).total,0),mp=loans.reduce((a,l)=>a+(+l.monthlyPayment||0),0);return `<div class="section card borrower"><div class="sectionhead"><div><h3>👤 ${b}</h3><span class="muted">ချေးငွေ ${loans.length} မျိုး · လစဉ်သတ်မှတ်ငွေ ${fmt(mp)} THB</span></div><button class="smallbtn" onclick="addLoan('${esc(b)}')">＋ ချေးငွေထည့်</button></div><div class="summary"><div><span class="muted">စုစုပေါင်းကျန်ငွေ</span><b class="red">${fmt(total)} THB</b></div><div><span class="muted">လစဉ်သတ်မှတ်ငွေ</span><b>${fmt(mp)} THB</b></div></div>${loans.map(l=>{let c=loanCalc(l);return `<div class="section card loan" onclick="loanDetail('${l.id}')"><div class="sectionhead"><div><h3>💳 ${l.type}</h3><span class="muted">မူရင်း ${fmt(l.principal)} THB · အတိုး ${l.rate}% / လ</span></div><b class="red">${fmt(c.total)} THB</b></div><div class="grid3"><div class="kpi">တစ်လအတိုး<b>${fmt(c.monthly)}</b></div><div class="kpi">မပေးသေးလ ${cMonth(c)}<b>${cMonth(c)}</b></div><div class="kpi">အတိုးကျန်<b>${fmt(c.outInterest)}</b></div></div></div>`}).join('')}</div>`}
function cMonth(c){return ''+Math.max(0,Math.round(c.accrued/c.monthly||0))+' လ'}function esc(s){return String(s).replace(/'/g,"\\'")}
function addBorrower(){openLoanForm('',true)}function addLoan(b){openLoanForm(b,false)}
function openLoanForm(b,isNew){modal.innerHTML=`<div class="sheet"><div class="sheethead"><div><h2>＋ ချေးငွေထည့်မည်</h2><p class="muted">အတိုးနှုန်းကို ပုံမှန် 10% / လ ထားထားပါတယ်</p></div><button class="close" onclick="closeModal()">×</button></div><div class="formrow"><label>ချေးငွေယူသူအမည်</label><input id="db" class="control" value="${b}" placeholder="အမည်"></div><div class="formrow"><label>ချေးငွေအမျိုးအစား</label><input id="dt" class="control" placeholder="ဥပမာ - အိမ်ချေး / ဆိုင်ချေး"></div><div class="row"><div class="formrow"><label>မူရင်းချေးငွေ (THB)</label><input id="dp" class="control" type="number" value="20000"></div><div class="formrow"><label>အတိုး (% / လ)</label><input id="dr" class="control" type="number" value="10"></div></div><div class="row"><div class="formrow"><label>အတိုးမပေးသေးသောလ</label><input id="dm" class="control" type="number" min="0" value="0"></div><div class="formrow"><label>လစဉ်သတ်မှတ်ငွေ</label><input id="dmp" class="control" type="number" min="0" value="0"></div></div><div class="row"><div class="formrow"><label>အတိုးပေးပြီးငွေ</label><input id="dip" class="control" type="number" min="0" value="0"></div><div class="formrow"><label>အတိုးရပ် / လျှော့ငွေ</label><input id="dis" class="control" type="number" min="0" value="0"></div></div><div class="formrow"><label>မူရင်းပြန်ဆပ်ပြီးငွေ</label><input id="dpp" class="control" type="number" min="0" value="0"></div><button class="bigbtn" onclick="saveLoan()">💾 ချေးငွေသိမ်းမည်</button></div>`;modal.classList.remove('hidden')}
function saveLoan(){let b=db.value.trim(),t=dt.value.trim(),p=+dp.value||0;if(!b||!t||p<=0)return alert('အမည်၊ ချေးငွေအမျိုးအစားနဲ့ မူရင်းချေးငွေ ထည့်ပါ');S.debts.push({id:Date.now().toString(),borrower:b,type:t,principal:p,rate:+dr.value||10,unpaidMonths:+dm.value||0,monthlyPayment:+dmp.value||0,interestPaid:+dip.value||0,interestStop:+dis.value||0,principalPaid:+dpp.value||0});save();closeModal();render()}
function loanDetail(id){let l=S.debts.find(x=>x.id===id);if(!l)return;let c=loanCalc(l);modal.innerHTML=`<div class="sheet"><div class="sheethead"><div><h2>💳 ${l.type}</h2><p class="muted">${l.borrower}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="grid3"><div class="kpi">မူရင်းချေးငွေ<b>${fmt(l.principal)} THB</b></div><div class="kpi">အတိုးနှုန်း<b>${l.rate}% / လ</b></div><div class="kpi">တစ်လအတိုး<b>${fmt(c.monthly)} THB</b></div></div><div class="section card"><h3>📊 အတိုးအသေးစိတ်</h3><table class="table"><tr><td>အတိုးမပေးသေးသောလ</td><td class="right">${l.unpaidMonths} လ</td></tr><tr><td>စုစုပေါင်းတက်ထားသောအတိုး</td><td class="right">${fmt(c.accrued)} THB</td></tr><tr><td>အတိုးပေးပြီးငွေ</td><td class="right green">-${fmt(c.interestPaid)} THB</td></tr><tr><td>အတိုးရပ် / လျှော့ငွေ</td><td class="right green">-${fmt(c.stop)} THB</td></tr><tr><td>လက်ကျန်အတိုး</td><td class="right red"><b>${fmt(c.outInterest)} THB</b></td></tr><tr><td>မူရင်းလက်ကျန်</td><td class="right">${fmt(c.remainPrincipal)} THB</td></tr><tr><td><b>စုစုပေါင်းပေးရန်</b></td><td class="right red"><b>${fmt(c.total)} THB</b></td></tr></table></div><div class="section card"><h3>💵 လစဉ်သတ်မှတ်ငွေ</h3><div class="amount" style="font-size:27px;color:var(--p)">${fmt(l.monthlyPayment)} THB / လ</div><p class="note">ဥပမာ မူရင်း 20,000 THB × 10% = တစ်လအတိုး 2,000 THB။ 10 လ မပေးလျှင် စုစုပေါင်းတက်အတိုး 20,000 THB ဖြစ်ပါတယ်။</p></div><button class="bigbtn" onclick="editLoan('${l.id}')">✏️ ပြင်မည်</button><button class="bigbtn danger" onclick="deleteLoan('${l.id}')">🗑️ ဒီချေးငွေဖျက်မည်</button></div>`;modal.classList.remove('hidden')}
function editLoan(id){let l=S.debts.find(x=>x.id===id);closeModal();setTimeout(()=>{modal.innerHTML=`<div class="sheet"><div class="sheethead"><h2>✏️ ချေးငွေပြင်မည်</h2><button class="close" onclick="closeModal()">×</button></div><div class="formrow"><label>ချေးငွေအမျိုးအစား</label><input id="et" class="control" value="${l.type}"></div><div class="row"><div class="formrow"><label>မူရင်းချေးငွေ</label><input id="ep" class="control" type="number" value="${l.principal}"></div><div class="formrow"><label>အတိုး % / လ</label><input id="er" class="control" type="number" value="${l.rate}"></div></div><div class="row"><div class="formrow"><label>အတိုးမပေးသေးသောလ</label><input id="em" class="control" type="number" value="${l.unpaidMonths}"></div><div class="formrow"><label>လစဉ်သတ်မှတ်ငွေ</label><input id="empay" class="control" type="number" value="${l.monthlyPayment}"></div></div><div class="row"><div class="formrow"><label>အတိုးပေးပြီးငွေ</label><input id="eip" class="control" type="number" value="${l.interestPaid}"></div><div class="formrow"><label>အတိုးရပ် / လျှော့ငွေ</label><input id="eis" class="control" type="number" value="${l.interestStop}"></div></div><div class="formrow"><label>မူရင်းပြန်ဆပ်ပြီးငွေ</label><input id="epp" class="control" type="number" value="${l.principalPaid}"></div><button class="bigbtn" onclick="updateLoan('${id}')">💾 ပြင်ဆင်ချက်သိမ်းမည်</button></div>`;modal.classList.remove('hidden')},80)}
function updateLoan(id){let l=S.debts.find(x=>x.id===id);Object.assign(l,{type:et.value.trim(),principal:+ep.value||0,rate:+er.value||10,unpaidMonths:+em.value||0,monthlyPayment:+empay.value||0,interestPaid:+eip.value||0,interestStop:+eis.value||0,principalPaid:+epp.value||0});save();closeModal();render()}
function deleteLoan(id){if(confirm('ဒီချေးငွေကို ဖျက်မလား?')){S.debts=S.debts.filter(x=>x.id!==id);save();closeModal();render()}}
function pick(date){let old=S.records[recKey(new Date(date))]||'',opts=[['attend','🔵 အလုပ်ဆင်း'],['absent','🔴 ပျက်ရက်'],['off','🟡 နားရက်'],['leave','🟣 ခွင့်']];modal.innerHTML=`<div class="sheet"><div class="sheethead"><h2>📅 ${date}</h2><button class="close" onclick="closeModal()">×</button></div>${opts.map(o=>`<button class="mi ${old===o[0]?'active':''}" onclick="setDay('${date}','${o[0]}')">${o[1]}</button>`).join('')}<button class="mi" onclick="setDay('${date}','')">⚪ မသတ်မှတ်ထား</button></div>`;modal.classList.remove('hidden')}
function setDay(date,x){let k=recKey(new Date(date));if(x)S.records[k]=x;else delete S.records[k];save();closeModal();render()}function closeModal(){modal.classList.add('hidden')}
function bind(){let e=document.getElementById('emp');if(e)e.onchange=()=>{S.employee=e.value;save();render()};let p=document.getElementById('period');if(p)p.onchange=()=>{S.period=p.value;save();render()}}
function saveSalary(){S.daily=+daily.value||0;S.extra=+extra.value||0;S.deductions=+deductions.value||0;S.period=period.value;save();render();alert('လစာသတ်မှတ်ချက် သိမ်းပြီးပါပြီ')}function changeAccount(){let nu=newUser.value.trim(),np=newPass.value,np2=newPass2.value;if(!nu)return alert('Username ထည့်ပါ');if(np&&np!==np2)return alert('Password နှစ်ခု မတူပါ');S.user=nu;if(np)S.pass=np;save();alert('Username / Password ပြောင်းပြီးပါပြီ');go('dashboard')}
if(localStorage.getItem('salary_session')==='1')showApp();
</script></body></html>
