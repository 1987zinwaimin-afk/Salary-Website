<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c4cff"><title>Salary Manager</title>
<style>
:root{--p:#6948ff;--p2:#9a55ff;--c:#13c9ee;--ink:#172033;--muted:#738096;--bg:#f5f6ff;--card:#fff;--green:#19b978;--red:#f04b63;--yellow:#d89500;--purple:#7447df;--shadow:0 14px 35px rgba(48,37,120,.13)}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 0 0,#ddf8ff,#f5f6ff 42%,#eeeaff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{border:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative;overflow:hidden}.orb{position:absolute;border-radius:50%;filter:blur(2px);animation:float 5s ease-in-out infinite}.o1{width:190px;height:190px;background:#a86aff;left:-65px;top:-55px}.o2{width:145px;height:145px;background:#1bd9ef;right:-45px;bottom:80px;animation-delay:1s}.loginbox{width:min(420px,100%);background:#ffffffdd;backdrop-filter:blur(20px);padding:30px;border-radius:32px;box-shadow:0 30px 70px #35218b30;text-align:center;position:relative;z-index:1}.logo{width:92px;height:92px;border-radius:28px;margin:auto auto 15px;display:grid;place-items:center;font-size:45px;color:#fff;background:linear-gradient(145deg,var(--p2),var(--p));box-shadow:9px 11px 0 #4930a522,0 20px 35px #6948ff44;animation:float 3s ease-in-out infinite}h1{margin:0 0 6px;font-size:29px}.sub{margin:0 0 20px;color:var(--muted)}.field{width:100%;padding:14px 15px;border:1px solid #dfe3ef;border-radius:15px;margin:6px 0;background:#fff;outline:0}.field:focus{border-color:var(--p);box-shadow:0 0 0 4px #6948ff18}.primary{width:100%;padding:14px;border-radius:15px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));font-weight:800;box-shadow:0 10px 22px #6948ff35;margin-top:8px}.hint{font-size:12px;color:#8a91a5;margin-top:12px}@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
.app{max-width:900px;margin:auto;padding:10px 12px 88px}.top{position:sticky;top:0;z-index:20;padding:6px 0 10px;background:#f5f6ffe8;backdrop-filter:blur(14px)}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brandicon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:22px;background:linear-gradient(145deg,var(--p2),var(--p));box-shadow:5px 6px 0 #4930a522}.brand b{font-size:17px}.brand small{display:block;color:var(--muted)}.menuBtn{width:45px;height:45px;border-radius:15px;background:#fff;box-shadow:var(--shadow);font-size:22px}.pageTitle{margin:15px 2px 12px}.pageTitle h2{margin:0;font-size:24px}.pageTitle p{margin:4px 0 0;color:var(--muted);font-size:13px}.hero{padding:20px;border-radius:27px;color:#fff;background:linear-gradient(135deg,#5c3ee7,#8c4dff 50%,#13c9ee);box-shadow:0 20px 45px #5c3ee73b;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-55px;top:-75px;background:#ffffff22}.hero small{opacity:.82}.amount{font-size:34px;font-weight:900;margin:4px 0}.hero select{background:#ffffff22;color:#fff;border:1px solid #ffffff55;padding:9px 11px;border-radius:12px;max-width:180px}.hero select option{color:#111}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.card{background:#ffffffdf;border:1px solid #fff;border-radius:21px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-size:25px;margin-top:3px}.muted{color:var(--muted);font-size:12px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.purple{color:var(--purple)}.section{margin-top:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.sectionhead h3{margin:0;font-size:17px}.control{width:100%;padding:12px;border:1px solid #e0e4ef;border-radius:14px;background:#fff}.label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{min-height:75px;border-radius:15px;border:2px solid #e5e8f0;background:#fff;padding:6px;text-align:center;box-shadow:0 5px 12px #1f25450b;cursor:pointer}.day .dow{font-size:10px;color:#8790a4}.day strong{display:block;font-size:17px}.day .status{font-size:9px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden}.attend{background:#eaf2ff;border-color:#4f8cff;color:#1769ff}.absent{background:#ffe8ed;border-color:#ff6178;color:#e42f4b}.off{background:#fff5d8;border-color:#ffc84a;color:#a56d00}.leave{background:#f0eaff;border-color:#8c69ee;color:#7048dc}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.pill{padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800}.pa{background:#e5f0ff;color:#1769ff}.px{background:#ffe7eb;color:#e42f4b}.po{background:#fff4d6;color:#b77800}.pl{background:#eee8ff;color:#7048dc}.bigbtn{width:100%;padding:13px;border-radius:15px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800}.danger{background:#ffe7eb;color:#df3450}.menu{position:fixed;inset:0;background:#10112055;backdrop-filter:blur(5px);z-index:50}.drawer{margin-left:auto;width:min(350px,88vw);height:100%;background:#fff;border-radius:28px 0 0 28px;padding:22px;animation:slide .22s ease;box-shadow:-20px 0 55px #0003}.drawer h2{margin:0}.mi{width:100%;display:flex;align-items:center;gap:12px;padding:15px;border-radius:16px;background:#f6f7fb;margin:8px 0;text-align:left;font-weight:800}.mi span{font-size:22px}@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}.modal{position:fixed;inset:0;background:#10112066;backdrop-filter:blur(6px);z-index:60;display:grid;place-items:end}.sheet{width:min(600px,100%);background:#fff;border-radius:28px 28px 0 0;padding:22px;max-height:92vh;overflow:auto;animation:up .22s ease}@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{width:42px;height:42px;border-radius:50%;background:#f0f1f6;font-size:22px}.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(620px,calc(100% - 20px));background:#ffffffed;backdrop-filter:blur(16px);border-radius:22px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;box-shadow:0 15px 40px #34217a22;z-index:25}.nav{padding:9px 4px;border-radius:15px;background:transparent;color:#687286;font-size:11px;font-weight:800}.nav.active{background:#eee9ff;color:#6540dc}.nav span{display:block;font-size:20px;margin-bottom:2px}@media(min-width:701px){.stats{grid-template-columns:repeat(4,1fr)}.modal{place-items:center}.sheet{border-radius:28px}.bottom{width:620px}}
</style>
</head>
<body>
<div id="loginPage" class="login"><div class="orb o1"></div><div class="orb o2"></div><div class="loginbox"><div class="logo">💰</div><h1>Salary Manager</h1><p class="sub">လစာနဲ့ အလုပ်ဆင်းရက် စီမံခန့်ခွဲရန်</p><input id="u" class="field" placeholder="Username" autocomplete="username"><input id="pw" class="field" type="password" placeholder="Password" autocomplete="current-password"><button class="primary" onclick="login()">🔐 Login ဝင်မည်</button><div class="hint">ပထမဆုံးအသုံးပြုရန် — admin / 1234</div></div></div>
<div id="app" class="hidden"><div class="app"><header class="top"><div class="toprow"><div class="brand"><div class="brandicon">💰</div><div><b>Salary Manager</b><small id="topSub">Dashboard</small></div></div><button class="menuBtn" onclick="openMenu()">☰</button></div></header><main id="main"></main></div><nav class="bottom"><button class="nav" data-page="dashboard" onclick="go('dashboard')"><span>🏠</span>Dashboard</button><button class="nav" data-page="attendance" onclick="go('attendance')"><span>📅</span>Attendance</button><button class="nav" data-page="salary" onclick="go('salary')"><span>💰</span>လစာ</button><button class="nav" data-page="settings" onclick="go('settings')"><span>⚙️</span>Settings</button></nav></div>
<div id="menu" class="menu hidden" onclick="if(event.target.id==='menu')closeMenu()"><aside class="drawer"><div class="toprow"><h2>☰ Menu</h2><button class="close" onclick="closeMenu()">×</button></div><p class="muted">စာမျက်နှာကို ရွေးပါ</p><button class="mi" onclick="logout()"><span>🚪</span>Logout</button></aside></div>
<div id="modal" class="modal hidden"></div>
<script>
const EMP=['Zin Wai Min','Khom','Zin Min Thu'];const key='salary_manager_v3';let S=JSON.parse(localStorage.getItem(key)||'null')||{user:'admin',pass:'1234',employee:'Zin Wai Min',daily:500,period:'2026-08',records:{},extra:0,deductions:0};let page='dashboard';
function save(){localStorage.setItem(key,JSON.stringify(S))}function login(){if(u.value===S.user&&pw.value===S.pass){localStorage.setItem('salary_session','1');showApp()}else alert('Username သို့မဟုတ် Password မမှန်ပါ')}function logout(){localStorage.removeItem('salary_session');document.getElementById('app').classList.add('hidden');document.getElementById('loginPage').classList.remove('hidden');closeMenu()}function showApp(){document.getElementById('loginPage').classList.add('hidden');document.getElementById('app').classList.remove('hidden');go(page)}function openMenu(){document.getElementById('menu').classList.remove('hidden')}function closeMenu(){document.getElementById('menu').classList.add('hidden')}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function periodDates(){let[y,m]=S.period.split('-').map(Number),start=new Date(y,m-1,26),end=new Date(y,m,25),a=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))a.push(new Date(d));return a}function recKey(d){return S.employee+'_'+S.period+'_'+d.toISOString().slice(0,10)}function status(d){return S.records[recKey(d)]||''}function counts(){let c={attend:0,absent:0,off:0,leave:0};periodDates().forEach(d=>{let x=status(d);if(x)c[x]++});return c}function calc(){let c=counts(),base=c.attend*Number(S.daily||0);return{...c,base,final:Math.max(0,base+Number(S.extra||0)-Number(S.deductions||0))}}function fmt(n){return Number(n||0).toLocaleString('en-US')}function statusLabel(x){return{attend:'အလုပ်ဆင်း',absent:'ပျက်ရက်',off:'နားရက်',leave:'ခွင့်'}[x]||'မသတ်မှတ်'}function pageHead(t,s){return`<div class="pageTitle"><h2>${t}</h2><p>${s}</p></div>`}
function render(){document.getElementById('topSub').textContent={dashboard:'Dashboard',attendance:'Attendance',salary:'လစာတွက်ချက်မှု',settings:'Settings'}[page];document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));let m=document.getElementById('main');if(page==='dashboard')m.innerHTML=dashboardPage();if(page==='attendance')m.innerHTML=attendancePage();if(page==='salary')m.innerHTML=salaryPage();if(page==='settings')m.innerHTML=settingsPage();bindPage()}
function employeeSelect(){return`<select id="emp" class="control"><option ${S.employee===EMP[0]?'selected':''}>${EMP[0]}</option><option ${S.employee===EMP[1]?'selected':''}>${EMP[1]}</option><option ${S.employee===EMP[2]?'selected':''}>${EMP[2]}</option></select>`}
function dashboardPage(){let c=calc();return pageHead('🏠 Dashboard','လစာအခြေအနေကို တစ်ချက်ကြည့်ရန်')+`<section class="hero"><small>ရရှိမည့်လစာ</small><div class="amount">${fmt(c.final)} THB</div><div class="row"><div><small>ဝန်ထမ်း</small>${employeeSelect()}</div><div><small>လစာကာလ</small><input id="period" class="control" type="month" value="${S.period}"></div></div></section><div class="stats"><div class="card stat">🔵<span class="muted">အလုပ်ဆင်း</span><b class="green">${c.attend}</b>ရက်</div><div class="card stat">🔴<span class="muted">ပျက်ရက်</span><b class="red">${c.absent}</b>ရက်</div><div class="card stat">🟡<span class="muted">နားရက်</span><b class="yellow">${c.off}</b>ရက်</div><div class="card stat">🟣<span class="muted">ခွင့်ရက်</span><b class="purple">${c.leave}</b>ရက်</div></div><div class="section"><div class="card"><div class="sectionhead"><h3>💵 လစာအနှစ်ချုပ်</h3></div><div class="summary"><div><span class="muted">အခြေခံလစာ</span><b>${fmt(c.base)} THB</b></div><div><span class="muted">အပိုငွေ</span><b>${fmt(S.extra)} THB</b></div><div><span class="muted">နုတ်ငွေ</span><b>${fmt(S.deductions)} THB</b></div><div><span class="muted">ရရှိမည့်လစာ</span><b class="green">${fmt(c.final)} THB</b></div></div></div></div>`}
function attendancePage(){let days=periodDates();return pageHead('📅 Attendance','ရက်တစ်ရက်ချင်းနှိပ်ပြီး အလုပ်ဆင်း / ပျက် / နား / ခွင့် သတ်မှတ်ပါ')+`<div class="card"><div class="row"><div><label class="label">ဝန်ထမ်း</label>${employeeSelect()}</div><div><label class="label">လစာကာလ</label><input id="period" class="control" type="month" value="${S.period}"></div></div><div class="legend"><span class="pill pa">🔵 အလုပ်ဆင်း</span><span class="pill px">🔴 ပျက်</span><span class="pill po">🟡 နား</span><span class="pill pl">🟣 ခွင့်</span></div><p class="muted">ရက်ကိုနှိပ်ပါ → အခြေအနေရွေးပါ။ အရောင်ပြောင်းသွားရင် သိမ်းပြီးသားပါ။</p></div><div class="section"><div class="calendar">${days.map(d=>{let x=status(d);return`<button class="day ${x}" onclick="pick('${d.toISOString().slice(0,10)}')"><span class="dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}</span><strong>${d.getDate()}/${d.getMonth()+1}</strong><span class="status">${statusLabel(x)}</span></button>`}).join('')}</div></div>`}
function salaryPage(){let c=calc();return pageHead('💰 လစာတွက်ချက်မှု','တစ်ရက်လစာ၊ အပိုငွေ၊ နုတ်ငွေကို ပြင်နိုင်ပါတယ်')+`<div class="card"><label class="label">ဝန်ထမ်း</label>${employeeSelect()}<div class="row" style="margin-top:10px"><div><label class="label">တစ်ရက်လစာ (THB)</label><input id="daily" class="control" type="number" min="0" value="${S.daily}"></div><div><label class="label">လစာကာလ</label><input id="period" class="control" type="month" value="${S.period}"></div></div><div class="row" style="margin-top:10px"><div><label class="label">အပိုငွေ / OT</label><input id="extra" class="control" type="number" min="0" value="${S.extra}"></div><div><label class="label">နုတ်ငွေ</label><input id="deductions" class="control" type="number" min="0" value="${S.deductions}"></div></div><button class="bigbtn" style="margin-top:12px" onclick="saveSalary()">💾 လစာသတ်မှတ်ချက် သိမ်းမည်</button></div><div class="section"><div class="card"><div class="sectionhead"><h3>📊 လစာတွက်ချက်မှု</h3></div><p>အလုပ်ဆင်း ${c.attend} ရက် × ${fmt(S.daily)} THB = <b>${fmt(c.base)} THB</b></p><p>အပိုငွေ = <b>${fmt(S.extra)} THB</b></p><p>နုတ်ငွေ = <b>${fmt(S.deductions)} THB</b></p><h2 class="green">ရရှိမည့်လစာ — ${fmt(c.final)} THB</h2></div></div>`}
function settingsPage(){return pageHead('⚙️ Settings','Account သတ်မှတ်ချက်များ')+`<div class="card"><h3>👤 Login Account</h3><p class="muted">Username / Password ကို ကိုယ်တိုင်ပြောင်းနိုင်ပါတယ်။</p><label class="label">Username အသစ်</label><input id="newUser" class="control" value="${S.user}"><label class="label" style="margin-top:10px">Password အသစ်</label><input id="newPass" class="control" type="password" placeholder="Password အသစ်"><label class="label" style="margin-top:10px">Password ပြန်ရိုက်ပါ</label><input id="newPass2" class="control" type="password" placeholder="Confirm Password"><button class="bigbtn" style="margin-top:12px" onclick="changeAccount()">🔐 Account ပြောင်းပြီး သိမ်းမည်</button></div>`}
function bindPage(){let e=document.getElementById('emp');if(e)e.onchange=()=>{S.employee=e.value;save();render()};let p=document.getElementById('period');if(p)p.onchange=()=>{S.period=p.value;save();render()}}function saveSalary(){S.daily=Number(document.getElementById('daily').value||0);S.extra=Number(document.getElementById('extra').value||0);S.deductions=Number(document.getElementById('deductions').value||0);S.period=document.getElementById('period').value;save();render();alert('လစာသတ်မှတ်ချက် သိမ်းပြီးပါပြီ')}
function pick(date){let old=S.records[recKey(new Date(date))]||'',opts=[['attend','🔵 အလုပ်ဆင်း'],['absent','🔴 ပျက်ရက်'],['off','🟡 နားရက်'],['leave','🟣 ခွင့်']];document.getElementById('modal').innerHTML=`<div class="sheet"><div class="sheethead"><div><h2 style="margin:0">📅 ${date}</h2><p class="muted">အခြေအနေရွေးပါ</p></div><button class="close" onclick="closeModal()">×</button></div>${opts.map(o=>`<button class="mi ${old===o[0]?'active':''}" onclick="setDay('${date}','${o[0]}')">${o[1]}</button>`).join('')}<button class="mi" onclick="setDay('${date}','')">⚪ မသတ်မှတ်ထား</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function setDay(date,x){let k=recKey(new Date(date));if(x)S.records[k]=x;else delete S.records[k];save();closeModal();render()}function closeModal(){document.getElementById('modal').classList.add('hidden')}function changeAccount(){let nu=document.getElementById('newUser').value.trim(),np=document.getElementById('newPass').value,np2=document.getElementById('newPass2').value;if(!nu)return alert('Username ထည့်ပါ');if(np&&np!==np2)return alert('Password နှစ်ခု မတူပါ');S.user=nu;if(np)S.pass=np;save();alert('Username / Password ပြောင်းပြီးပါပြီ');go('dashboard')}if(localStorage.getItem('salary_session')==='1')showApp();
</script></body></html>
