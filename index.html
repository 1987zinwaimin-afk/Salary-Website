<script>

let present = 0;
let absent = 0;

let employeeData = {};

const calendar =
document.getElementById("calendar");

for(let i=1;i<=31;i++){

let day =
document.createElement("div");

day.classList.add("day");

day.innerText = i;

day.onclick = function(){

if(day.classList.contains("present")){

day.classList.remove("present");

day.classList.add("absent");

present--;
absent++;

}
else if(day.classList.contains("absent")){

day.classList.remove("absent");

absent--;

}
else{

day.classList.add("present");

present++;

}

updateData();
autoSave();

};

calendar.appendChild(day);

}

function updateData(){

document.getElementById("presentCount")
.innerText = present;

document.getElementById("absentCount")
.innerText = absent;

let dailySalary =
Number(document.getElementById("dailySalary").value || 0);

let salary = present * dailySalary;

document.getElementById("salaryTotal")
.innerText = salary;

let room =
Number(document.getElementById("room").value || 0);

let food =
Number(document.getElementById("food").value || 0);

let bike =
Number(document.getElementById("bike").value || 0);

let fuel =
Number(document.getElementById("fuel").value || 0);

let debt =
Number(document.getElementById("debt").value || 0);

let home =
Number(document.getElementById("home").value || 0);

let other =
Number(document.getElementById("other").value || 0);

let finalSalary =
salary - room - food - bike - fuel - debt - home - other;

document.getElementById("finalSalary")
.innerText = finalSalary;

}

document.querySelectorAll("input")
.forEach(input=>{

input.addEventListener("input",function(){

updateData();

autoSave();

});

});

function autoSave(){

let name =
document.getElementById("employee").value;

employeeData[name] = {

present,

absent,

salary:
document.getElementById("salaryTotal").innerText,

room:
document.getElementById("room").value || 0,

food:
document.getElementById("food").value || 0,

bike:
document.getElementById("bike").value || 0,

fuel:
document.getElementById("fuel").value || 0,

debt:
document.getElementById("debt").value || 0,

home:
document.getElementById("home").value || 0,

other:
document.getElementById("other").value || 0,

final:
document.getElementById("finalSalary").innerText

};

renderTable();

}

function renderTable(){

let table =
document.getElementById("tableBody");

table.innerHTML = "";

for(let name in employeeData){

let d = employeeData[name];

table.innerHTML += `

<tr>

<td>${name}</td>

<td>${d.present}</td>

<td>${d.absent}</td>

<td>${d.salary}</td>

<td>${d.room}</td>

<td>${d.food}</td>

<td>${d.bike}</td>

<td>${d.fuel}</td>

<td>${d.debt}</td>

<td>${d.home}</td>

<td>${d.other}</td>

<td>${d.final}</td>

<td>

<button onclick="editData('${name}')">
Edit
</button>

<button onclick="deleteData('${name}')">
Delete
</button>

</td>

</tr>

`;

}

}

function editData(name){

let d = employeeData[name];

document.getElementById("employee").value = name;

document.getElementById("room").value = d.room;

document.getElementById("food").value = d.food;

document.getElementById("bike").value = d.bike;

document.getElementById("fuel").value = d.fuel;

document.getElementById("debt").value = d.debt;

document.getElementById("home").value = d.home;

document.getElementById("other").value = d.other;

present = d.present;

absent = d.absent;

document.getElementById("presentCount")
.innerText = present;

document.getElementById("absentCount")
.innerText = absent;

document.getElementById("salaryTotal")
.innerText = d.salary;

document.getElementById("finalSalary")
.innerText = d.final;

}

function deleteData(name){

delete employeeData[name];

renderTable();

}
