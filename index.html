<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f1f5f9;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,
select,
button{
padding:10px;
margin:5px;
border-radius:10px;
border:1px solid #ccc;
}

button{
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.hidden{
display:none;
}

.logo{
width:120px;
height:120px;
border-radius:20px;
object-fit:cover;
display:block;
margin:auto;
margin-bottom:20px;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
margin-top:20px;
}

.day{
padding:15px;
background:#ddd;
text-align:center;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.present{
background:#2563eb;
color:white;
}

.absent{
background:red;
color:white;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th,
table td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#111827;
color:white;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="container" id="loginPage">

<div class="card" style="max-width:400px;margin:auto;margin-top:50px;">

<img
id="loginLogo"
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_TV_2015.png"
>

<h1 id="loginTitle">
Login
</h1>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button type="submit">
Login
</button>

</form>

</div>

</div>

<!-- MAIN -->

<div class="container hidden" id="mainPage">

<!-- TOP -->

<div class="card">

<div class="topbar">

<h1 id="mainTitle">
Salary System
</h1>

<div>

<select id="language">

<option value="en">
English
</option>

<option value="mm">
မြန်မာ
</option>

</select>

<button onclick="openSettings()"
id="settingBtn">

Settings

</button>

</div>

</div>

</div>

<!-- SETTINGS -->

<div class="card hidden"
id="settingsBox">

<h2 id="settingTitle">
Settings
</h2>

<input
type="text"
id="newUsername"
placeholder="New Username"
>

<input
type="password"
id="newPassword"
placeholder="New Password"
>

<input
type="text"
id="logoUrl"
placeholder="Logo Image URL"
>

<button onclick="saveSettings()"
id="saveSettingBtn">

Save Settings

</button>

</div>

<!-- INPUT -->

<div class="card">

<select id="employee">

<option>Zin Wai Min</option>

<option>Khom</option>

<option>Zin Min Thu</option>

</select>

<input
type="number"
id="dailySalary"
placeholder="Daily Salary"
value="500"
>

<input type="month" id="month">

<br>

<input
type="number"
id="room"
placeholder="Room Rent"
>

<input
type="number"
id="food"
placeholder="Food Cost"
>

<input
type="number"
id="bike"
placeholder="Bike Cost"
>

<input
type="number"
id="fuel"
placeholder="Fuel Cost"
>

<input
type="number"
id="debt"
placeholder="Debt"
>

<input
type="number"
id="home"
placeholder="Home Payment"
>

<input
type="number"
id="other"
placeholder="Other Cost"
>

<!-- CALENDAR -->

<div class="calendar" id="calendar"></div>

<h3>

<span id="presentText">
Present
</span>

:
<span id="presentCount">
0
</span>

|

<span id="absentText">
Absent
</span>

:
<span id="absentCount">
0
</span>

|

<span id="salaryText">
Salary
</span>

:
<span id="salaryTotal">
0
</span>

|

<span id="finalText">
Final Salary
</span>

:
<span id="finalSalary">
0
</span>

</h3>

</div>

<!-- TABLE -->

<div class="card">

<table>

<thead>

<tr>

<th id="thName">Name</th>
<th id="thPresent">Present</th>
<th id="thAbsent">Absent</th>
<th id="thSalary">Salary</th>
<th id="thRoom">Room</th>
<th id="thFood">Food</th>
<th id="thBike">Bike</th>
<th id="thFuel">Fuel</th>
<th id="thDebt">Debt</th>
<th id="thHome">Home</th>
<th id="thOther">Other</th>
<th id="thFinal">Final</th>
<th id="thAction">Action</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<script>

/* LOGIN */

let loginUsername =
localStorage.getItem("username") || "admin";

let loginPassword =
localStorage.getItem("password") || "1234";

let savedLogo =
localStorage.getItem("logo");

if(savedLogo){

document.getElementById("loginLogo").src =
savedLogo;

}

document.getElementById("loginForm")
.addEventListener("submit",function(e){

e.preventDefault();

let user =
document.getElementById("username").value.trim();

let pass =
document.getElementById("password").value.trim();

if(user === loginUsername &&
pass === loginPassword){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainPage")
.classList.remove("hidden");

}
else{

alert("Wrong Username or Password");

}

});

document.getElementById("settingsBox")
.classList.toggle("hidden");

}

document.getElementById("newUsername").value;

document.getElementById("newPassword").value;

document.getElementById("logoUrl").value;

"username",
newUser
);

"password",
newPass
);

loginPassword = newPass;

}

if(logo){

localStorage.setItem(
"logo",
logo
);

document.getElementById("loginLogo").src =
logo;

}

alert("Saved");

}
