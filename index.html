<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f2f5ff;
padding:20px;
}

.login-box,
.main-box{
max-width:1200px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:20px;
color:#1e3a8a;
}

input,select,button{
padding:10px;
margin:5px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#2563eb;
color:white;
cursor:pointer;
border:none;
}

button:hover{
background:#1d4ed8;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
margin-bottom:20px;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
margin-top:20px;
}

.day{
padding:15px;
background:#e5e7eb;
text-align:center;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.present{
background:#2563eb;
color:white;
}

.absent{
background:#ef4444;
color:white;
}

.summary{
margin-top:20px;
background:#f8fafc;
padding:15px;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

table th,table td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

.action-btn{
padding:5px 10px;
border:none;
border-radius:5px;
color:white;
cursor:pointer;
}

.edit{
background:orange;
}

.delete{
background:red;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginPage">

<h1 id="loginTitle">Login</h1>

<input type="text" id="username" placeholder="Username"><br>
<input type="password" id="password" placeholder="Password"><br>

<button onclick="login()" id="loginBtn">Login</button>

</div>

<!-- MAIN -->
<div class="main-box hidden" id="mainPage">

<div class="top-bar">

<h1 id="mainTitle">Salary System</h1>

<div>

<select id="language" onchange="changeLanguage()">
<option value="en">English</option>
<option value="mm">မြန်မာ</option>
</select>

<select id="month">
<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>
</select>

<select id="year">
<option>2025</option>
<option>2026</option>
<option>2027</option>
<option>2028</option>
</select>

</div>

</div>

<!-- INPUT -->
<div class="grid">

<select id="employee">
<option>Zin Wai Min</option>
<option>Khom</option>
<option>Zin Min Thu</option>
</select>

<input type="number" id="dailySalary" placeholder="Daily Salary">

<input type="number" id="room" placeholder="Room Rent">

<input type="number" id="food" placeholder="Food Cost">

<input type="number" id="bike" placeholder="Bike Cost">

<input type="number" id="fuel" placeholder="Fuel Cost">

<input type="number" id="debt" placeholder="Debt">

<input type="number" id="home" placeholder="Home Payment">

<input type="number" id="other" placeholder="Other Cost">

</div>

<!-- CALENDAR -->
<div class="calendar" id="calendar"></div>

<!-- SUMMARY -->
<div class="summary">

<h2 id="summaryTitle">Summary</h2>

<p id="presentText">Present Days : <span id="presentCount">0</span></p>

<p id="absentText">Absent Days : <span id="absentCount">0</span></p>

<p id="salaryText">Salary : <span id="salaryTotal">0</span></p>

<p id="finalText">Final Salary : <span id="finalSalary">0</span></p>

<br>

<button onclick="saveData()" id="saveBtn">Save</button>

</div>

<!-- TABLE -->
<table>

<thead>

<tr>

<th id="thName">Name</th>
<th id="thPresent">Present</th>
<th id="thAbsent">Absent</th>
<th id="thSalary">Salary</th>
<th id="thRoom">Room</th>
<th id="thFood">Food</th>
<th id="thBike">Bike</th>
<th id="thFuel">Fuel</th>
<th id="thDebt">Debt</th>
<th id="thHome">Home</th>
<th id="thOther">Other</th>
<th id="thFinal">Final</th>
<th id="thAction">Action</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

let present = 0;
let absent = 0;

let employeeData = {};

const calendar = document.getElementById("calendar");

for(let i=1;i<=31;i++){

let day = document.createElement("div");

day.classList.add("day");

day.innerText = i;

day.onclick = function(){

if(day.classList.contains("present")){

day.classList.remove("present");

day.classList.add("absent");

present--;
absent++;

}else if(day.classList.contains("absent")){

day.classList.remove("absent");

absent--;

}else{

day.classList.add("present");

present++;

}

updateData();

};

calendar.appendChild(day);

}

function updateData(){

document.getElementById("presentCount").innerText = present;

document.getElementById("absentCount").innerText = absent;

let dailySalary =
Number(document.getElementById("dailySalary").value) || 0;

let salary = present * dailySalary;

document.getElementById("salaryTotal").innerText = salary;

let room =
Number(document.getElementById("room").value) || 0;

let food =
Number(document.getElementById("food").value) || 0;

let bike =
Number(document.getElementById("bike").value) || 0;

let fuel =
Number(document.getElementById("fuel").value) || 0;

let debt =
Number(document.getElementById("debt").value) || 0;

let home =
Number(document.getElementById("home").value) || 0;

let other =
Number(document.getElementById("other").value) || 0;

let final =
salary - room - food - bike - fuel - debt - home - other;

document.getElementById("finalSalary").innerText = final;

}

document.querySelectorAll("input").forEach(input=>{
input.addEventListener("input",updateData);
});

function saveData(){

let name =
document.getElementById("employee").value;

employeeData[name] = {

present,
absent,

salary:
document.getElementById("salaryTotal").innerText,

room:
document.getElementById("room").value || 0,

food:
document.getElementById("food").value || 0,

bike:
document.getElementById("bike").value || 0,

fuel:
document.getElementById("fuel").value || 0,

debt:
document.getElementById("debt").value || 0,

home:
document.getElementById("home").value || 0,

other:
document.getElementById("other").value || 0,

final:
document.getElementById("finalSalary").innerText

};

renderTable();

clearInputs();

}

function renderTable(){

let table =
document.getElementById("tableBody");

table.innerHTML = "";

for(let name in employeeData){

let data = employeeData[name];

table.innerHTML += `

<tr>

<td>${name}</td>
<td>${data.present}</td>
<td>${data.absent}</td>
<td>${data.salary}</td>
<td>${data.room}</td>
<td>${data.food}</td>
<td>${data.bike}</td>
<td>${data.fuel}</td>
<td>${data.debt}</td>
<td>${data.home}</td>
<td>${data.other}</td>
<td>${data.final}</td>

<td>

<button class="action-btn edit"
onclick="editData('${name}')">
Edit
</butto
