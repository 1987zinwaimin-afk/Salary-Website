<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary System</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial;
    background:#f1f5f9;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button{
    padding:10px;
    margin:5px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#0f172a;
    color:white;
}

.day{
    width:40px;
    height:40px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin:4px;
    border-radius:10px;
    background:#d1d5db;
    cursor:pointer;
    font-weight:bold;
}

.present{
    background:#2563eb;
    color:white;
}

.absent{
    background:red;
    color:white;
}

#mainPage{
    display:none;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage" class="container">

<div class="card" style="max-width:400px;margin:auto;margin-top:100px;">

<h2 id="loginTitle">Login</h2>

<input type="text" id="username" placeholder="Username"><br>

<input type="password" id="password" placeholder="Password"><br>

<button onclick="login()" id="loginBtn">Login</button>

<p id="loginMsg"></p>

</div>

</div>

<!-- MAIN PAGE -->

<div id="mainPage">

<div class="container">

<div class="topbar">

<h2 id="mainTitle">Salary System</h2>

<div>

<select id="language" onchange="changeLanguage()">

<option value="en">English</option>

<option value="mm">မြန်မာ</option>

</select>

<button onclick="logout()" id="logoutBtn">Logout</button>

</div>

</div>

<div class="card">

<h3 id="employeeText">Employee Data</h3>

<input type="month" id="month">

<select id="employee">

<option>Zin Wai Min</option>

<option>Khom</option>

<option>Zin Min Thu</option>

</select>

<input type="number" id="dailySalary" placeholder="Daily Salary">

<div id="calendar"></div>

<h3>

<span id="presentText">Present</span> :
<span id="presentCount">0</span>

|

<span id="absentText">Absent</span> :
<span id="absentCount">0</span>

|

<span id="salaryText">Salary</span> :
<span id="salaryTotal">0</span>

</h3>

<hr>

<input type="number" id="room" placeholder="Room Rent">

<input type="number" id="food" placeholder="Food Cost">

<input type="number" id="bike" placeholder="Bike Cost">

<input type="number" id="fuel" placeholder="Fuel Cost">

<input type="number" id="debt" placeholder="Debt">

<input type="number" id="home" placeholder="Home Money">

<br><br>

<button onclick="saveData()" id="saveBtn">Save</button>

</div>

<table>

<thead>

<tr>

<th id="thName">Name</th>
<th id="thMonth">Month</th>
<th id="thPresent">Present</th>
<th id="thAbsent">Absent</th>
<th id="thSalary">Salary</th>
<th id="thRoom">Room</th>
<th id="thFood">Food</th>
<th id="thBike">Bike</th>
<th id="thFuel">Fuel</th>
<th id="thDebt">Debt</th>
<th id="thHome">Home</th>
<th id="thFinal">Final Salary</th>
<th id="thAction">Action</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<script>

let present = 0;
let absent = 0;

function login(){

let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;

if(user === "Admin" && pass === "1234"){

document.getElementById("loginPage").style.display = "none";

document.getElementById("mainPage").style.display = "block";

generateCalendar();

}else{

document.getElementById("loginMsg").innerText = "Wrong Username or Password";

}

}

function logout(){

location.reload();

}

function generateCalendar(){

let calendar = document.getElementById("calendar");

calendar.innerHTML = "";

present = 0;
absent = 0;

for(let i=1;i<=31;i++){

let day = document.createElement("div");

day.classList.add("day");

day.innerText = i;

day.onclick = function(){

if(day.classList.contains("present")){

day.classList.remove("present");
day.classList.add("absent");

present--;
absent++;

}else if(day.classList.contains("absent")){

day.classList.remove("absent");

absent--;

}else{

day.classList.add("present");

present++;

}

updateSalary();

};

calendar.appendChild(day);

}

}

function updateSalary(){

document.getElementById("presentCount").innerText = present;

document.getElementById("absentCount").innerText = absent;

let daily = Number(document.getElementById("dailySalary").value || 0);

document.getElementById("salaryTotal").innerText = present * daily;

}

document.getElementById("dailySalary").addEventListener("input",updateSalary);

function saveData(){

let name = document.getElementById("employee").value;

let month = document.getElementById("month").value;

let salary = Number(document.getElementById("salaryTotal").innerText);

let room = Number(document.getElementById("room").value || 0);

let food = Number(document.getElementById("food").value || 0);

let bike = Number(document.getElementById("bike").value || 0);

let fuel = Number(document.getElementById("fuel").value || 0);

let debt = Number(document.getElementById("debt").value || 0);

let home = Number(document.getElementById("home").value || 0);

let finalSalary =
salary - room - food - bike - fuel - debt - home;

let table = document.getElementById("tableBody");

let rows = table.getElementsByTagName("tr");

let found = false;

for(let i=0; i<rows.length; i++){

let rowName = rows[i].cells[0].innerText;

if(rowName === name){

rows[i].cells[1].innerText = month;
rows[i].cells[2].innerText = present;
rows[i].cells[3].innerText = absent;
rows[i].cells[4].innerText = salary;
rows[i].cells[5].innerText = room;
rows[i].cells[6].innerText = food;
rows[i].cells[7].innerText = bike;
rows[i].cells[8].innerText = fuel;
rows[i].cells[9].innerText = debt;
rows[i].cells[10].innerText = home;
rows[i].cells[11].innerText = finalSalary;

found = true;

break;

}

}

if(!found){

table.innerHTML += `

<tr>

<td>${name}</td>
<td>${month}</td>
<td>${present}</td>
<td>${absent}</td>
<td>${salary}</td>
<td>${room}</td>
<td>${food}</td>
<td>${bike}</td>
<td>${fuel}</td>
<td>${debt}</td>
<td>${home}</td>
<td>${finalSalary}</td>

<td>

<button onclick="deleteRow(this)">Delete</button>

</td>

</tr>

`;

}

document.getElementById("room").value = "";
document.getElementById("food").value = "";
document.getElementById("bike").value = "";
document.getElementById("fuel").value = "";
document.getElementById("debt").value = "";
document.getElementById("home").value = "";

}

btn.parentElement.parentEl
