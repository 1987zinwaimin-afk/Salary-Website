<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary System</title>

<style>
body{
font-family:Arial;
background:#f2f5ff;
margin:0;
padding:20px;
}

.loginBox,
.mainBox{
max-width:1100px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
margin:0 0 20px;
}

input,select,button{
padding:10px;
border-radius:10px;
border:1px solid #ccc;
margin:5px;
}

button{
background:#2563eb;
color:white;
cursor:pointer;
border:none;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
margin-top:20px;
}

.day{
background:white;
padding:15px;
text-align:center;
border-radius:10px;
cursor:pointer;
border:1px solid #ddd;
font-weight:bold;
}

.day.active{
background:#2563eb;
color:white;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

table th,table td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

.topBar{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
}

.settingBox{
margin-top:20px;
padding:15px;
border:1px solid #ddd;
border-radius:15px;
}

.logo{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
display:block;
margin:auto;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="loginBox" id="loginPage">

<img id="loginLogo"
class="logo"
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h1 id="loginTitle">Login</h1>

<input type="text" id="username" placeholder="Username"><br>

<input type="password" id="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

</div>

<!-- MAIN -->

<div class="mainBox hidden" id="mainPage">

<div class="topBar">

<div>
<h1 id="title">Salary System</h1>

<select id="language" onchange="changeLanguage()">
<option value="en">English</option>
<option value="mm">မြန်မာ</option>
</select>
</div>

<div>

<select id="employee" onchange="changeEmployee()">
<option>Zin Wai Min</option>
<option>Khom</option>
<option>Zin Min Thu</option>
</select>

<br>

<input type="month" id="monthYear">

<br>

<input type="number"
id="salaryInput"
placeholder="Salary">

</div>

</div>

<h2 id="attendanceText">Attendance</h2>

<div class="calendar" id="calendar"></div>

<h2 id="expenseText">Expenses</h2>

<input type="number" id="room" placeholder="Room">
<input type="number" id="food" placeholder="Food">
<input type="number" id="debt" placeholder="Debt">
<input type="number" id="fuel" placeholder="Fuel">
<input type="number" id="other" placeholder="Other">

<table>

<thead>

<tr>
<th id="nameText">Name</th>
<th id="salaryText">Salary</th>
<th id="dayText">Days</th>
<th id="roomText">Room</th>
<th id="foodText">Food</th>
<th id="debtText">Debt</th>
<th id="fuelText">Fuel</th>
<th id="otherText">Other</th>
<th id="finalText">Final</th>
<th>Edit</th>
<th>Delete</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

<!-- SETTINGS -->

<div class="settingBox">

<h2>Settings</h2>

<input type="text"
id="newUser"
placeholder="New Username">

<input type="password"
id="newPass"
placeholder="New Password">

<button onclick="saveSettings()">
Save Login
</button>

<br><br>

<input type="text"
id="logoUrl"
placeholder="Logo Image URL">

<button onclick="changeLogo()">
Change Logo
</button>

</div>

</div>

<script>

let savedUser =
localStorage.getItem("username") || "admin";

let savedPass =
localStorage.getItem("password") || "1234";

let employees =
JSON.parse(localStorage.getItem("employees")) ||

{

"Zin Wai Min":{
salary:5000,
days:[],
room:0,
food:0,
debt:0,
fuel:0,
other:0
},

"Khom":{
salary:7000,
days:[],
room:0,
food:0,
debt:0,
fuel:0,
other:0
},

"Zin Min Thu":{
salary:6000,
days:[],
room:0,
food:0,
debt:0,
fuel:0,
other:0
}

};

function saveEmployees(){
localStorage.setItem(
"employees",
JSON.stringify(employees)
);
}

function login(){

let u =
document.getElementById("username").value;

let p =
document.getElementById("password").value;

if(u===savedUser && p===savedPass){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainPage")
.classList.remove("hidden");

loadEmployee();
createCalendar();
renderTable();

}else{
alert("Wrong Username or Password");
}

}

function currentEmployee(){
return document.getElementById("employee").value;
}

function loadEmployee(){

let emp =
employees[currentEmployee()];

document.getElementById("salaryInput").value =
emp.salary;

document.getElementById("room").value =
emp.room || "";

document.getElementById("food").value =
emp.food || "";

document.getElementById("debt").value =
emp.debt || "";

document.getElementById("fuel").value =
emp.fuel || "";

document.getElementById("other").value =
emp.other || "";

createCalendar();
renderTable();
}

function changeEmployee(){
loadEmployee();
}

function createCalendar(){

let cal =
document.getElementById("calendar");

cal.innerHTML="";

let emp =
employees[currentEmployee()];

for(let i=1;i<=31;i++){

let div =
document.createElement("div");

div.className="day";

if(emp.days.includes(i)){
div.classList.add("active");
}

div.innerText=i;

div.onclick=function(){

if(emp.days.includes(i)){

emp.days=
emp.days.filter(d=>d!==i);

}else{

emp.days.push(i);

}

saveEmployees();

createCalendar();

renderTable();

};

cal.appendChild(div);

}

}

document.getElementById("salaryInput")
.addEventListener("input",function(){

employees[currentEmployee()].salary =
Number(this.value);

saveEmployees();
renderTable();

});

["room","food","debt","fuel","other"]
.forEach(id=>{

document.getElementById(id)
.addEventListener("input",function(){

employees[currentEmployee()][id] =
Number(this.value);

saveEmployees();

renderTable();

});

});

function renderTable(){

let body =
document.getElementById("tableBody");

body.innerHTML="";

let empName =
currentEmployee();

let emp =
employees[empName];

let finalSalary =

(emp.salary * emp.days.length)

-

(emp.room +
emp.food +
emp.debt +
emp.fuel +
emp.other);

body.innerHTML += `

<tr>

<td>${empName}</td>

<td>${emp.salary}</td>

<td>${emp.days.length}</td>

<td>${emp.room}</td>

<td>${emp.food}</td>

<td>${emp.debt}</td>

<td>${emp.fuel}</td>

<td>${emp.other}</td>

<td>${finalSalary}</td>

<td>
<button onclick="editData()">
Edit
</button>
</td>

<td>
<button onclick="deleteData()">
Delete
</button>
</td>

</tr>

`;

}

function editData(){

loadEmployee();

alert("Edit Ready");

}

function deleteData(){

if(confirm("Delete Data?")){

employees[currentEmployee()] = {

salary:0,
days:[],
room:0,
food:0,
debt:0,
fuel:0,
other:0

};

saveEmployees();

loadEmployee();

}

}

function saveSettings(){

let newUser =
document.getElementById("newUser").value;

let newPass =
document.getElementById("newPass").value;

if(newUser){
localStorage.setItem("username",newUser);
savedUser=newUser;
}

if(newPass){
localStorage.setItem("password",newPass);
savedPass=newPass;
}

alert("Saved");

}

function changeLogo(){

let url =
document.getElementById("logoUrl").value;

if(url){

document.getElementById("loginLogo").src=url;

localStorage.setItem("logo",url);

}

}

let savedLogo =
localStorage.getItem("logo");

if(savedLogo){

document.getElementById("loginLogo").src =
savedLogo;

}

function changeLanguage(){

let lang =
document.getElementById("language").value;

if(lang==="mm"){

document.getElementById("title").innerText =
"လစာစနစ်";

document.getElementById("attendanceText").innerText =
"အလုပ်ဆင်းရက်";

document.getElementById("expenseText").innerText =
"အသုံးစရိတ်";

document.getElementById("nameText").innerText =
"အမည်";

document.getElementById("salaryText").innerText =
"လစာ";

document.getElementById("dayText").innerText =
"ရက်";

document.getElementById("roomText").innerText =
"အခန်းခ";

document.getElementById("foodText").innerText =
"စားစရိတ်";

document.getElementById("debtText").innerText =
"အကြွေး";

document.getElementById("fuelText").innerText =
"ဆီဖိုး";

document.getElementById("otherText").innerText =
"အခြား";

document.getElementById("finalText").innerText =
"ကျန်ငွေ";

}else{

document.getElementById("title").innerText =
"Salary System";

document.getElementById("attendanceText").innerText =
"Attendance";

document.getElementById("expenseText").innerText =
"Expenses";

document.getElementById("nameText").innerText =
"Name";

document.getElementById("salaryText").innerText =
"Salary";

document.getElementById("dayText").innerText =
"Days";

document.getElementById("roomText").innerText =
"Room";

document.getElementById("foodText").innerText =
"Food";

document.getElementById("debtText").innerText =
"Debt";

document.getElementById("fuelText").innerText =
"Fuel";

document.getElementById("otherText").innerText =
"Other";

document.getElementById("finalText").innerText =
"Final";

}

}

</script>

</body>
</html>
