<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
font-family:Arial;
background:#f1f5f9;
padding:50px;
}

.box{
background:white;
padding:20px;
max-width:300px;
margin:auto;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
background:blue;
color:white;
border:none;
}

</style>

</head>

<body>

<div class="box">

<h2>Login</h2>

<input type="text" id="user" placeholder="Username">

<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

var u =
document.getElementById("user").value;

var p =
document.getElementById("pass").value;

if(u=="admin" && p=="1234"){

alert("Login Success");

}
else{

alert("Wrong Username or Password");

}

}

</script>

</body>
</html>
