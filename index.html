ar(--shadow);font-size:22px}.pageTitle{margin:15px 2px 12px}.pageTitle h2{margin:0;font-size:24px}.pageTitle p{margin:4px 0;color:var(--muted);font-size:13px}.hero{padding:20px;border-radius:27px;color:#fff;background:linear-gradient(135deg,#5c3ee7,#8c4dff 50%,#13c9ee);box-shadow:0 20px 45px #5c3ee73b}.amount{font-size:34px;font-weight:900}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{margin-top:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.sectionhead h3{margin:0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary .box{padding:12px;border-radius:15px;background:#f7f8fc}.summary b{display:block;font-size:18px;margin-top:3px}.horizontal{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}.horizontal::-webkit-scrollbar{display:none}.person,.loan{flex:0 0 auto;padding:16px;border-radius:20px;background:linear-gradient(145deg,#fff,#f4f0ff);border:2px solid #e7e0ff;box-shadow:0 10px 25px #4d32a214}.person{width:190px;cursor:pointer}.person b,.loan b{display:block;font-size:18px}.person small,.loan small{color:var(--muted)}.loan{width:205px;cursor:pointer}.loan .price{font-size:20px;color:var(--red);font-weight:900;margin-top:6px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{padding:12px;border-radius:15px;background:#f7f8fc}.kpi b{display:block;font-size:17px;margin-top:4px}.formrow{margin:9px 0}.formrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{min-height:75px;border-radius:15px;border:2px solid #e5e8f0;background:#fff;padding:6px;text-align:center;cursor:pointer}.day .dow{font-size:10px;color:#8790a4}.day strong{display:block;font-size:17px}.day .status{font-size:9px;font-weight:800}.attend{background:#eaf2ff;border-color:#4f8cff;color:#1769ff}.absent{background:#ffe8ed;border-color:#ff6178;color:#e42f4b}.off{background:#fff5d8;border-color:#ffc84a;color:#a56d00}.leave{background:#f0eaff;border-color:#8c69ee;color:#7048dc}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.pill{padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800}.pa{background:#e5f0ff;color:#1769ff}.px{background:#ffe7eb;color:#e42f4b}.po{background:#fff4d6;color:#b77800}.pl{background:#eee8ff;color:#7048dc}.smallbtn{padding:10px 12px;border-radius:12px;background:#eee9ff;color:#6540dc;font-weight:800}.danger{background:#ffe7eb!important;color:#df3450!important}.menu{position:fixed;inset:0;background:#10112055;z-index:50}.drawer{margin-left:auto;width:min(350px,88vw);height:100%;background:#fff;border-radius:28px 0 0 28px;padding:22px}.mi{width:100%;display:flex;align-items:center;gap:12px;padding:15px;border-radius:16px;background:#f6f7fb;margin:8px 0;text-align:left;font-weight:800}.modal{position:fixed;inset:0;background:#10112066;z-index:60;display:grid;place-items:end}.sheet{width:min(650px,100%);padding:22px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{box-shadow:none;background:#f0f1f6}.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(700px,calc(100% - 20px));background:#ffffffed;backdrop-filter:blur(16px);border-radius:22px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 15px 40px #34217a22;z-index:25}.nav{padding:8px 2px;border-radius:15px;background:transparent;color:#687286;font-size:10px;font-weight:800}.nav.active{background:#eee9ff;color:#6540dc}.nav span{display:block;font-size:19px;margin-bottom:2px}.table{width:100%;border-collapse:collapse}.table td{padding:9px 4px;border-bottom:1px solid #eee;font-size:13px}.right{text-align:right}.moneyGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.moneyCard{padding:11px 12px;border-radius:15px;background:#fff;border:1px solid #e5e8ed;box-shadow:0 5px 14px rgba(30,40,70,.0 </style></head><body><div id="loginPage" class="login"><div class="loginbox"><div class="logo">💰</div><h1>Salary Manager</h1><p class="muted">လစာ၊ Attendance နဲ့ အကြွေးစာရင်း</p><input id="u" class="field" placeholder="Username"><input id="pw" class="field" type="password" placeholder="Password"><button class="primary" onclick="login()">🔐 Login ဝင်မည်</button><div class="muted" style="font-size:12px;margin-top:10px">ပထမဆုံးအသုံးပြုရန် — admin / 1234</div></div></div><div id="app" class="hidden"><div class="app"><header class="top"><div class="toprow"><div class="brand"><div class="brandicon">💰</div><div><b>Salary Manager</b><small id="topSub">Dashboard</small></div></div><button class="menuBtn" onclick="openMenu()">☰</button></div></header><main id="main"></main></div><nav class="bottom"><button class="nav" data-page="dashboard" onclick="go('dashboard')"><span>🏠</span>Dashboard</button><button class="nav" data-page="attendance" onclick="go('attendance')"><span>📅</span>Attendance</button><button class="nav" data-page="salary" onclick="go('salary')"><span>💰</span>လစာ</button><button class="nav" data-page="debt" onclick="go('debt')"><span>📒</span>အကြွေး</button><button class="nav" data-page="settings" onclick="go('settings')"><span>⚙️</span>Settings</button></nav></div><div id="menu" class="menu hidden" onclick="if(event.target.id==='menu')closeMenu()"><aside class="drawer"><div class="toprow"><h2>☰ Menu</h2><button class="close" onclick="closeMenu()">×</button></div><button class="mi danger" onclick="logout()">🚪 Logout</button></aside></div><div id="modal" class="modal hidden"></div><script>const KEY='salary_manager_v3',EMP=['Zin Wai Min','Khom','Zin Min Thu'];let S=JSON.parse(localStorage.getItem(KEY)||'null')||{user:'admin',pass:'1234',employee:EMP[0],daily:500,period:'2026-08',records:{},extra:0,deductions:0,debts:[]};S.debts=S.debts||[];let page='dashboard';const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const fmt=n=>(+n||0).toLocaleString('en-US');const money=(n,c='THB')=>`${fmt(n)} ${c==='MMK'?'MMK':'THB'}`;const currName=c=>c==='MMK'?'မြန်မာကျပ် (MMK)':'ထိုင်းဘတ် (THB)';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function login(){if(u.value===S.user&&pw.value===S.pass){localStorage.setItem('salary_session','1');showApp()}else alert('Username သို့မဟုတ် Password မမှန်ပါ')}function logout(){localStorage.removeItem('salary_session');app.classList.add('hidden');loginPage.classList.remove('hidden');closeMenu()}function showApp(){loginPage.classList.add('hidden');app.classList.remove('hidden');render()}function openMenu(){menu.classList.remove('hidden')}function closeMenu(){menu.classList.add('hidden')}function go(p){page=p;render();scrollTo(0,0)}function periodDates(){let[y,m]=S.period.split('-').map(Number),a=[],d=new Date(y,m-1,26),e=new Date(y,m,25);for(;d<=e;d.setDate(d.getDate()+1))a.push(new Date(d));return a}function recKey(d){return S.employee+'_'+S.period+'_'+d.toISOString().slice(0,10)}function status(d){return S.records[recKey(d)]||''}function counts(){let c={attend:0,absent:0,off:0,leave:0};periodDates().forEach(d=>{let x=status(d);if(x)c[x]++});return c}function salaryCalc(){let c=counts(),base=c.attend*(+S.daily||0);return{...c,base,final:Math.max(0,base+(+S.extra||0)-(+S.deductions||0))}}function empSelect(){return `<select id="emp" class="control">${EMP.map(x=>`<option ${x===S.employee?'selected':''}>${x}</option>`).join('')}</select>`}function head(t,s){return `<div class="pageTitle"><h2>${t}</h2>${s?`<p>${s}</p>`:''}</div>`}function render(){topSub.textContent={dashboard:'Dashboard',attendance:'Attendance',salary:'လစာ',debt:'အကြွေးစာရင်း',settings:'Settings'}[page];document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));main.innerHTML={dashboard:dashboardPage,attendance:attendancePage,salary:salaryPage,debt:debtPage,settings:settingsPage}[page]();bind()}function dashboardPage(){let c=salaryCalc(),bs=borrowers(),groups={};S.debts.forEach(l=>{let cur=l.currency||'THB',x=loanCalc(l);groups[cur]??={principal:0,total:0,interest:0,payable:0,count:0};groups[cur].principal+=+l.principal||0;groups[cur].total+=x.total;groups[cur].interest+=x.outInterest;groups[cur].payable+=0;groups[cur].count++});let card=(cur,label,cls)=>{let g=groups[cur]||{principal:0,total:0,interest:0,payable:0,count:0};return `<section class="moneyCard ${cls}"><div class="muted">${cur==='MMK'?'🇲🇲':'🇹🇭'} ${label}</div><div class="big">${money(g.total,cur)}</div><div class="moneyLine"><span>ရရန်</span><b>${money(g.total,cur)}</b></div><div class="moneyLine"><span>ပေးရန်</span><b>${money(g.payable,cur)}</b></div></section>`};return head('🏠 Dashboard','အကြွေးစာရင်းကို အပေါ်မှာ အရင်ကြည့်ရန်')+`<div class="dashMonth"><label class="muted">လစာကာလ</label><input id="period" class="control" type="month" value="${S.period}"></div><div class="dashTitle"><h3>📒 အကြွေးစာရင်း</h3><p>မြန်မာငွေ / ထိုင်းဘတ်ကို သီးခြားပြထားသည်</p></div><div class="moneyGrid debtTopGrid">${card('MMK','မြန်မာကျပ် (MMK)','red')} ${card('THB','ထိုင်းဘတ် (THB)','red')}</div><div class="dashTitle salaryDashTitle"><h3>💰 ဝန်ထမ်းလစာ</h3><p>ရွေးထားသောဝန်ထမ်း၏ ဒီလလစာ</p></div><div class="moneyGrid"><section class="moneyCard green"><div class="muted">💰 ရရှိမည့်လစာ</div><div class="big">${money(c.final,'THB')}</div><div class="moneyLine"><span>အလုပ်ဆင်း</span><b>${c.attend} ရက်</b></div><div class="moneyLine"><span>တစ်ရက်လစာ</span><b>${money(S.daily,'THB')}</b></div><div class="moneyLine"><span>အပို / နုတ်</span><b>${money((+S.extra||0)-(+S.deductions||0),'THB')}</b></div></section><section class="moneyCard blue"><div class="muted">👤 ဝန်ထမ်း</div><div class="big">${esc(S.employee)}</div><div class="moneyLine"><span>လစာအခြေခံ</span><b>${money(c.base,'THB')}</b></div><div class="moneyLine"><span>ဝန်ထမ်းစုစုပေါင်း</span><b>${bs.length} ယောက်</b></div><button class="smallbtn" style="padding:7px 9px;font-size:11px;margin-top:5px" onclick="go('attendance')">📅 Attendance →</button></section></div><div class="dashActions"><button class="dashAction" onclick="go('attendance')"><b>📅 Attendance</b><small>အလုပ်ဆင်းရက် စီမံရန်</small></button><button class="dashAction" onclick="go('debt')"><b>➕ အကြွေး</b><small>ချေးငွေ အသစ်ထည့်ရန်</small></button></div>`}function openBorrower(b){go('debt');setTimeout(()=>selectBorrower(b),30)}function attendancePage(){let days=periodDates(),c=salaryCalc();return head('📅 Attendance','Attendance နဲ့ တစ်ရက်လစာကို ဒီနေရာမှာပဲ သတ်မှတ်ပါ')+`<div class="card attendanceSettings"><div class="row"><div><label class="muted">ဝန်ထမ်း</label>${empSelect()}</div><div><label class="muted">လစာကာလ</label><input id="period" class="control" type="month" value="${S.period}"></div></div><div class="row" style="margin-top:10px"><div><label class="muted">တစ်ရက်လစာ (THB)</label><input id="daily" class="control" type="number" value="${S.daily}"></div><div><label class="muted">အပိုငွေ / OT (THB)</label><input id="extra" class="control" type="number" value="${S.extra}"></div></div><div class="row" style="margin-top:10px"><div><label class="muted">နုတ်ငွေ (THB)</label><input id="deductions" class="control" type="number" value="${S.deductions}"></div><div><label class="muted">ရရှိမည့်လစာ</label><div class="control" style="font-weight:900;color:var(--green)">${fmt(c.final)} THB</div></div></div><button class="bigbtn" onclick="saveAttendanceSettings()">💾 Attendance / လစာ သိမ်းမည်</button><div class="legend"><span class="pill pa">🔵 အလုပ်ဆင်း</span><span class="pill px">🔴 ပျက်</span><span class="pill po">🟡 နား</span><span class="pill pl">🟣 ခွင့်</span></div></div><div class="section"><div class="calendar">${days.map(d=>{let x=status(d),lab={attend:'အလုပ်ဆင်း',absent:'ပျက်',off:'နား',leave:'ခွင့်'}[x]||'—';return `<button class="day ${x}" onclick="pick('${d.toISOString().slice(0,10)}')"><span class="dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}</span><strong>${d.getDate()}/${d.getMonth()+1}</strong><span class="status">${lab}</span></button>`}).join('')}</div></div>`}function saveAttendanceSettings(){S.daily=+daily.value||0;S.extra=+extra.value||0;S.deductions=+deductions.value||0;S.period=period.value;save();render();alert('Attendance နဲ့ လစာသတ်မှတ်ချက် သိမ်းပြီးပါပြီ')}function salaryPage(){let c=salaryCalc();return head('💰 လစာ','Attendance ထဲမှာပဲ လစာသတ်မှတ်နိုင်ပါတယ်')+`<div class="card"><h3>📊 လစာအကျဉ်းချုပ်</h3><p>ဝန်ထမ်း — <b>${esc(S.employee)}</b></p><p>အလုပ်ဆင်း — ${c.attend} ရက်</p><p>တစ်ရက်လစာ — ${fmt(S.daily)} THB</p><p>အခြေခံလစာ — ${fmt(c.base)} THB</p><p>အပိုငွေ — ${fmt(S.extra)} THB</p><p>နုတ်ငွေ — ${fmt(S.deductions)} THB</p><h2 style="color:var(--green)">ရရှိမည့်လစာ — ${fmt(c.final)} THB</h2><button class="bigbtn" onclick="go('attendance')">📅 Attendance သို့သွားမည်</button></div>`}function settingsPage(){return head('⚙️ Settings','Login အကောင့်ပြင်ရန်')+`<div class="card"><label class="muted">Username</label><input id="newUser" class="control" value="${esc(S.user)}"><label class="muted">Password အသစ်</label><input id="newPass" class="control" type="password"><label class="muted">Password ပြန်ရိုက်ပါ</label><input id="newPass2" class="control" type="password"><button class="bigbtn" onclick="changeAccount()">🔐 သိမ်းမည်</button></div>`}function borrowers(){return [...new Set(S.debts.map(x=>x.borrower))]}function loanCalc(l){let p=Math.max(0,+l.principal||0),r=Math.max(0,+l.rate||10),monthly=p*r/100,elapsed=monthsFromDate(l.loanDate),ip=Math.max(0,+l.interestPaid||0),stop=Math.max(0,+l.interestStop||0),paidMonths=monthly>0?Math.min(elapsed,Math.floor(ip/monthly)):0,m=Math.max(0,elapsed-paidMonths),accrued=monthly*elapsed,out=Math.max(0,accrued-ip-stop),pp=Math.max(0,+l.principalPaid||0),rp=Math.max(0,p-pp);return{currency:l.currency||'THB',monthly,elapsed,paidMonths,unpaidMonths:m,accrued,interestPaid:ip,stop,outInterest:out,remainPrincipal:rp,total:rp+out}}function monthsFromDate(date){if(!date)return 0;let d=new Date(date+'T00:00:00'),n=new Date(),m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;return Math.max(0,m)}function debtPage(){let bs=borrowers();return head('📒 အကြွေးစာရင်း','ချေးငွေယူသူအမည်ကိုနှိပ်ပြီး ချေးငွေအမျိုးအစားများကိုကြည့်ပါ')+`<div class="card"><div class="sectionhead"><h3>👥 ချေးငွေယူသူ</h3><button class="smallbtn" onclick="addBorrower()">＋ အသစ်</button></div><div class="horizontal">${bs.map(b=>`<button class="person" onclick="selectBorrower('${esc(b)}')"><b>👤 ${esc(b)}</b><small>${S.debts.filter(x=>x.borrower===b).length} မျိုး</small></button>`).join('')||`<div class="muted">စာရင်းမရှိသေးပါ</div>`}</div></div><div id="borrowerView" class="section"></div>`}function selectBorrower(b){let box=document.getElementById('borrowerView'),ls=S.debts.filter(x=>x.borrower===b);box.innerHTML=`<div class="card"><div class="sectionhead"><div><h3>👤 ${esc(b)}</h3><span class="muted">ချေးငွေအမျိုးအစားများ</span></div><button class="smallbtn" onclick="addLoan('${esc(b)}')">＋ ချေးငွေထည့်</button></div><div class="horizontal">${ls.map(l=>{let c=loanCalc(l);return `<div class="loan" onclick="loanDetail('${l.id}')"><b>💳 ${esc(l.type)}</b><small>${money(l.principal,l.currency||'THB')} · ${l.rate}% / လ</small><div class="price">${money(c.total,l.currency||'THB')}</div></div>`}).join('')||`<div class="muted">ချေးငွေမရှိသေးပါ</div>`}</div></div>`;box.scrollIntoView({behavior:'smooth',block:'start'})}function addBorrower(){openLoanForm('')}function addLoan(b){openLoanForm(b)}function openLoanForm(b,isNew){modal.innerHTML=`<div class="sheet"><div class="sheethead"><div><h2>＋ ချေးငွေထည့်မည်</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="formrow"><label>ချေးငွေယူသူအမည်</label><input id="db" class="control" value="${esc(b)}" placeholder="အမည်"></div><div class="formrow"><label>ချေးငွေအမျိုးအစား</label><input id="dt" class="control" placeholder="ဥပမာ - Loan / အိမ် / ဆိုင်ကယ်"></div><div class="row"><div class="formrow"><label>ငွေကြေး</label><select id="dc" class="control"><option value="THB">🇹🇭 ထိုင်းဘတ် (THB)</option><option value="MMK">🇲🇲 မြန်မာကျပ် (MMK)</option></select></div><div class="formrow"><label>ချေးယူသည့်ရက်</label><input id="dd" class="control" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="row"><div class="formrow"><label>မူရင်းချေးငွေ</label><input id="dp" class="control" type="number" value="20000"></div><div class="formrow"><label>အတိုး (% / လ)</label><input id="dr" class="control" type="number" value="10"></div></div><div class="row"><div class="formrow"><label>အတိုးမပေးသေးသောလ (Auto)</label><input id="dm" class="control" type="number" min="0" value="0" readonly></div><div class="formrow"><label>လစဉ်သတ်မှတ်ငွေ</label><input id="dmp" class="control" type="number" min="0" value="0"></div></div><div class="row"><div class="formrow"><label>အတိုးပေးပြီးငွေ</label><input id="dip" class="control" type="number" min="0" value="0"></div><div class="formrow"><label>အတိုးရပ် / လျှော့ငွေ</label><input id="dis" class="control" type="number" min="0" value="0"></div></div><div class="formrow"><label>မူရင်းပြန်ဆပ်ပြီးငွေ</label><input id="dpp" class="control" type="number" min="0" value="0"></div><button class="bigbtn" onclick="saveLoan()">💾 သိမ်းမည်</button></div>`;modal.classList.remove('hidden')}function saveLoan(){let b=db.value.trim(),t=dt.value.trim(),p=+dp.value||0;if(!b||!t||p<=0)return alert('အမည်၊ ချေးငွေအမျိုးအစားနဲ့ မူရင်းချေးငွေ ထည့်ပါ');S.debts.push({id:Date.now().toString(),borrower:b,type:t,currency:dc.value,loanDate:dd.value,principal:p,rate:+dr.value||10,unpaidMonths:0,monthlyPayment:+dmp.value||0,interestPaid:+dip.value||0,interestStop:+dis.value||0,principalPaid:+dpp.value||0});save();closeModal();render();setTimeout(()=>selectBorrower(b),50)}function loanDetail(id){let l=S.debts.find(x=>x.id===id);if(!l)return;let c=loanCalc(l),cur=l.currency||'THB',elapsed=monthsFromDate(l.loanDate);modal.innerHTML=`<div class="sheet"><div class="sheethead"><div><h2>💳 ${esc(l.type)}</h2><p class="muted">${esc(l.borrower)} · ${currName(cur)}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="kpis"><div class="kpi">မူရင်း<b>${money(l.principal,cur)}</b></div><div class="kpi">အတိုး<b>${l.rate}% / လ</b></div><div class="kpi">တစ်လအတိုး<b>${money(c.monthly,cur)}</b></div></div><div class="section card"><table class="table"><tr><td>ချေးယူသည့်ရက်</td><td class="right">${l.loanDate||'—'}</td></tr><tr><td>ချေးပြီးကြာချိန်</td><td class="right">${c.elapsed} လ</td></tr><tr><td>အတိုးပေးပြီးလ</td><td class="right">${c.paidMonths} လ</td></tr><tr><td><b>အတိုးမပေးသေးသောလ</b></td><td class="right red"><b>${c.unpaidMonths} လ</b></td></tr><tr><td>မပေးသေးသောလအတိုး</td><td class="right red"><b>${money(c.monthly*c.unpaidMonths,cur)}</b></td></tr><tr><td>စုစုပေါင်းတက်ထားသောအတိုး</td><td class="right">${money(c.accrued,cur)}</td></tr><tr><td>အတိုးပေးပြီးငွေ</td><td class="right green">-${money(c.interestPaid,cur)}</td></tr><tr><td>အတိုးရပ် / လျှော့ငွေ</td><td class="right green">-${money(c.stop,cur)}</td></tr><tr><td>လက်ကျန်အတိုး</td><td class="right red"><b>${money(c.outInterest,cur)}</b></td></tr><tr><td>မူရင်းလက်ကျန်</td><td class="right">${money(c.remainPrincipal,cur)}</td></tr><tr><td>လစဉ်သတ်မှတ်ငွေ</td><td class="right">${money(l.monthlyPayment,cur)}</td></tr><tr><td><b>စုစုပေါင်းပေးရန်</b></td><td class="right red"><b>${money(c.total,cur)}</b></td></tr></table></div><button class="bigbtn" onclick="editLoan('${l.id}')">✏️ ပြင်မည်</button><button class="bigbtn danger" onclick="deleteLoan('${l.id}')">🗑️ ဖျက်မည်</button></div>`;modal.classList.remove('hidden')}function editLoan(id){let l=S.debts.find(x=>x.id===id),cur=l.currency||'THB';modal.innerHTML=`<div class="sheet"><div class="sheethead"><h2>✏️ ချေးငွေပြင်မည်</h2><button class="close" onclick="closeModal()">×</button></div><div class="formrow"><label>ချေးငွေအမျိုးအစား</label><input id="et" class="control" value="${esc(l.type)}"></div><div class="row"><div class="formrow"><label>ငွေကြေး</label><select id="ec" class="control"><option value="THB" ${cur==='THB'?'selected':''}>🇹🇭 ထိုင်းဘတ် (THB)</option><option value="MMK" ${cur==='MMK'?'selected':''}>🇲🇲 မြန်မာကျပ် (MMK)</option></select></div><div class="formrow"><label>ချေးယူသည့်ရက်</label><input id="ed" class="control" type="date" value="${l.loanDate||''}"></div></div><div class="row"><div class="formrow"><label>မူရင်းချေးငွေ</label><input id="ep" class="control" type="number" value="${l.principal}"></div><div class="formrow"><label>အတိုး % / လ</label><input id="er" class="control" type="number" value="${l.rate}"></div></div><div class="row"><div class="formrow"><label>အတိုးမပေးသေးသောလ (Auto)</label><input id="em" class="control" type="number" value="${loanCalc(l).unpaidMonths}" readonly></div><div class="formrow"><label>လစဉ်သတ်မှတ်ငွေ</label><input id="empay" class="control" type="number" value="${l.monthlyPayment}"></div></div><div class="row"><div class="formrow"><label>အတိုးပေးပြီးငွေ</label><input id="eip" class="control" type="number" value="${l.interestPaid}"></div><div class="formrow"><label>အတိုးရပ် / လျှော့ငွေ</label><input id="eis" class="control" type="number" value="${l.interestStop}"></div></div><div class="formrow"><label>မူရင်းပြန်ဆပ်ပြီးငွေ</label><input id="epp" class="control" type="number" value="${l.principalPaid}"></div><button class="bigbtn" onclick="updateLoan('${l.id}')">💾 သိမ်းမည်</button></div>`;modal.classList.remove('hidden')}function updateLoan(id){let l=S.debts.find(x=>x.id===id);Object.assign(l,{type:et.value.trim(),currency:ec.value,loanDate:ed.value,principal:+ep.value||0,rate:+er.value||10,unpaidMonths:0,monthlyPayment:+empay.value||0,interestPaid:+eip.value||0,interestStop:+eis.value||0,principalPaid:+epp.value||0});save();let b=l.borrower;closeModal();render();setTimeout(()=>selectBorrower(b),50)}function deleteLoan(id){if(confirm('ဒီချေးငွေကို ဖျက်မလား?')){S.debts=S.debts.filter(x=>x.id!==id);save();closeModal();render()}}function pick(date){let old=S.records[recKey(new Date(date))]||'',opts=[['attend','🔵 အလုပ်ဆင်း'],['absent','🔴 ပျက်ရက်'],['off','🟡 နားရက်'],['leave','🟣 ခွင့်']];modal.innerHTML=`<div class="sheet"><div class="sheethead"><h2>📅 ${date}</h2><button class="close" onclick="closeModal()">×</button></div>${opts.map(o=>`<button class="mi ${old===o[0]?'active':''}" onclick="setDay('${date}','${o[0]}')">${o[1]}</button>`).join('')}<button class="mi" onclick="setDay('${date}','')">⚪ မသတ်မှတ်ထား</button></div>`;modal.classList.remove('hidden')}function setDay(date,x){let k=recKey(new Date(date));if(x)S.records[k]=x;else delete S.records[k];save();closeModal();render()}function closeModal(){modal.classList.add('hidden')}function bind(){let e=document.getElementById('emp');if(e)e.onchange=()=>{S.employee=e.value;save();render()};let p=document.getElementById('period');if(p)p.onchange=()=>{S.period=p.value;save();render()}}function changeAccount(){let nu=newUser.value.trim(),np=newPass.value,np2=newPass2.value;if(!nu)return alert('Username ထည့်ပါ');if(np&&np!==np2)return alert('Password နှစ်ခု မတူပါ');S.user=nu;if(np)S.pass=np;save();alert('Username / Password ပြောင်းပြီးပါပြီ');go('dashboard')}if(localStorage.getItem('salary_session')==='1')showApp();</script><script>(function(){function stop(e){if(e.ctrlKey||e.scale!==undefined){e.preventDefault();}}document.addEventListener('gesturestart',stop,{passive:false});document.addEventListener('gesturechange',stop,{passive:false});document.addEventListener('gestureend',stop,{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});})();</script><script src="share.js"></script><script src="owner-data.js"></script><script src="payment-notification.js?v=20260827-2"></script><script src="approval-alert-fix.js"></script></body></html>
