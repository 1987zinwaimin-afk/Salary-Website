<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6948ff"><title>Salary Manager</title><style>:root{--p:#6948ff;--p2:#a04cff;--ink:#172033;--muted:#71809a;--bg:#f5f6ff;--red:#ef4760;--green:#18b978;--yellow:#d79500;--purple:#7548df}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e9fbff,#f5f6ff 50%,#eeeaff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{border:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox,.card,.sheet{background:#fffffff0;border-radius:24px;box-shadow:0 15px 40px #3f2b8b18}.loginbox{width:min(420px,100%);padding:28px;text-align:center}.logo,.brandicon{display:grid;place-items:center;color:white;background:linear-gradient(145deg,var(--p2),var(--p));box-shadow:7px 8px 0 #4b2aa322}.logo{width:90px;height:90px;border-radius:28px;margin:auto auto 14px;font-size:42px}.field,.control{width:100%;padding:13px;border:1px solid #dce1ee;border-radius:14px;background:white;margin:6px 0}.primary,.add,.bigbtn{padding:13px 16px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:white;font-weight:800}.primary,.bigbtn{width:100%;margin-top:8px}.app{max-width:900px;margin:auto;padding:10px 12px 88px}.top{position:sticky;top:0;z-index:20;background:#f5f6ffdf;backdrop-filter:blur(14px);padding:7px 0}.toprow{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brandicon{width:44px;height:44px;border-radius:14px;font-size:22px}.brand b{display:block}.brand small,.muted{color:var(--muted)}.menuBtn,.close{width:44px;height:44px;border-radius:14px;background:white;box-shadow:0 8px 20px #39247a18;font-size:21px}.pageTitle{margin:16px 2px}.pageTitle h2{margin:0}.pageTitle p{margin:5px 0;color:var(--muted);font-size:13px}.hero{padding:20px;border-radius:26px;color:white;background:linear-gradient(135deg,#5a3ee7,#944fff,#12c9ee);box-shadow:0 20px 40px #6445d333}.amount{font-size:34px;font-weight:900;margin:4px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats,.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.card{padding:16px}.stat b{display:block;font-size:25px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.purple{color:var(--purple)}.section{margin-top:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:70px;border:2px solid #e3e7f0;border-radius:14px;background:white;padding:5px;text-align:center}.day strong{display:block;font-size:16px}.day span{font-size:10px}.attend{background:#e8f1ff;border-color:#4e8cff;color:#1769ff}.absent{background:#ffe7ec;border-color:#ff6078;color:#e12f4b}.off{background:#fff4d5;border-color:#ffc646;color:#9c6900}.leave{background:#eee7ff;border-color:#8a65e9;color:#7045db}.legend{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.pill{padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800}.horizontal{display:flex;gap:10px;overflow-x:auto;padding:4px 1px 12px}.horizontal::-webkit-scrollbar{display:none}.person,.loan{min-width:175px;padding:15px;border-radius:20px;background:linear-gradient(145deg,#fff,#f4f0ff);border:2px solid #e7e0ff;box-shadow:0 10px 25px #4d32a214}.person{cursor:pointer}.person b,.loan b{display:block;font-size:18px}.loan{min-width:190px;cursor:pointer}.backline{display:flex;gap:8px;align-items:center;margin-bottom:10px}.back,.small{padding:10px 12px;border-radius:12px;background:#eee9ff;color:#6540dc;font-weight:800}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.full{grid-column:1/-1}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{padding:11px;border-radius:14px;background:#f6f7fb}.kpi b{display:block;font-size:16px;margin-top:4px}.table{width:100%;border-collapse:collapse}.table td{padding:9px 3px;border-bottom:1px solid #eee;font-size:13px}.right{text-align:right}.menu{position:fixed;inset:0;background:#10112055;z-index:50}.drawer{margin-left:auto;width:min(340px,88vw);height:100%;background:white;border-radius:26px 0 0 26px;padding:22px}.mi{width:100%;padding:15px;border-radius:15px;background:#f6f7fb;margin-top:10px;text-align:left;font-weight:800}.danger{background:#ffe7ec;color:#df3450}.modal{position:fixed;inset:0;background:#10112066;z-index:60;display:grid;place-items:end}.sheet{width:min(650px,100%);padding:22px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0}.sheethead{display:flex;justify-content:space-between;align-items:center}.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(700px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;background:#fffffff0;border-radius:22px;box-shadow:0 12px 35px #39247a22;z-index:25}.nav{padding:8px 2px;background:transparent;color:#687286;font-size:10px;font-weight:800;border-radius:14px}.nav.active{background:#eee9ff;color:#6540dc}.nav span{display:block;font-size:19px}@media(max-width:560px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}}@media(min-width:701px){.stats{grid-template-columns:repeat(4,1fr)}.modal{place-items:center}.sheet{border-radius:28px}}</style></head><body><div id="loginPage" class="login"><div class="loginbox"><div class="logo">💰</div><h1>Salary Manager</h1><p class="muted">လစာ၊ Attendance နဲ့ အကြွေးစာရင်း</p><input id="u" class="field" placeholder="Username"><input id="pw" class="field" type="password" placeholder="Password"><button class="primary" onclick="login()">🔐 Login ဝင်မည်</button><small class="muted">ပထမဆုံးအသုံးပြုရန် — admin / 1234</small></div></div><div id="app" class="hidden"><div class="app"><header class="top"><div class="toprow"><div class="brand"><div class="brandicon">💰</div><div><b>Salary Manager</b><small id="topSub">Dashboard</small></div></div><button class="menuBtn" onclick="openMenu()">☰</button></div></header><main id="main"></main></div><nav class="bottom"><button class="nav" data-p="dashboard" onclick="go('dashboard')"><span>🏠</span>Dashboard</button><button class="nav" data-p="attendance" onclick="go('attendance')"><span>📅</span>Attendance</button><button class="nav" data-p="salary" onclick="go('salary')"><span>💰</span>လစာ</button><button class="nav" data-p="debt" onclick="go('debt')"><span>📒</span>အကြွေး</button><button class="nav" data-p="settings" onclick="go('settings')"><span>⚙️</span>Settings</button></nav></div><div id="menu" class="menu hidden" onclick="if(event.target.id==='menu')closeMenu()"><aside class="drawer"><div class="toprow"><h2>☰ Menu</h2><button class="close" onclick="closeMenu()">×</button></div><p class="muted">Menu မှာ Logout တစ်ခုပဲရှိပါတယ်</p><button class="mi danger" onclick="logout()">🚪 Logout</button></aside></div><div id="modal" class="modal hidden"></div><script>const KEY='salary_manager_v3',EMP=['Zin Wai Min','Khom','Zin Min Thu'];let S=JSON.parse(localStorage.getItem(KEY)||'null')||{user:'admin',pass:'1234',employee:EMP[0],daily:500,period:'2026-08',records:{},extra:0,deductions:0,debts:[]};S.debts=S.debts||[];let page='dashboard',sel='';const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),fmt=n=>(+n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function login(){if(u.value===S.user&&pw.value===S.pass){localStorage.setItem('salary_session','1');showApp()}else alert('Username သို့မဟုတ် Password မမှန်ပါ')}function logout(){localStorage.removeItem('salary_session');app.classList.add('hidden');loginPage.classList.remove('hidden');closeMenu()}function showApp(){loginPage.classList.add('hidden');app.classList.remove('hidden');render()}function openMenu(){menu.classList.remove('hidden')}function closeMenu(){menu.classList.add('hidden')}function go(p){page=p;if(p!=='debt')sel='';render();scrollTo(0,0)}function emp(){return `<select id="emp" class="control">${EMP.map(x=>`<option ${x===S.employee?'selected':''}>${x}</option>`).join('')}</select>`}function dates(){let[y,m]=S.period.split('-').map(Number),a=[],d=new Date(y,m-1,26),e=new Date(y,m,25);for(;d<=e;d.setDate(d.getDate()+1))a.push(new Date(d));return a}function st(d){return S.records[S.employee+'_'+S.period+'_'+d.toISOString().slice(0,10)]||''}function counts(){let c={attend:0,absent:0,off:0,leave:0};dates().forEach(d=>{let x=st(d);if(x)c[x]++});return c}function salary(){let c=counts(),b=c.attend*(+S.daily||0);return{...c,base:b,final:Math.max(0,b+(+S.extra||0)-(+S.deductions||0))}}function head(a,b){return `<div class="pageTitle"><h2>${a}</h2><p>${b}</p></div>`}function render(){topSub.textContent={dashboard:'Dashboard',attendance:'Attendance',salary:'လစာ',debt:'အကြွေးစာရင်း',settings:'Settings'}[page];document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===page));main.innerHTML={dashboard:dash,attendance:attendance,salary:salaryPage,debt:debt,settings:settings}[page]();bind()}function dash(){let c=salary();return head('🏠 Dashboard','လစာအခြေအနေကို တစ်ချက်ကြည့်ရန်')+`<div class="hero"><small>ရရှိမည့်လစာ</small><div class="amount">${fmt(c.final)} THB</div><div class="row"><div><small>ဝန်ထမ်း</small>${emp()}</div><div><small>လစာကာလ</small><input id="period" class="control" type="month" value="${S.period}"></div></div></div><div class="stats"><div class="card stat">🔵 အလုပ်ဆင်း<b class="green">${c.attend}</b></div><div class="card stat">🔴 ပျက်<b class="red">${c.absent}</b></div><div class="card stat">🟡 နား<b class="yellow">${c.off}</b></div><div class="card stat">🟣 ခွင့်<b class="purple">${c.leave}</b></div></div>`}function attendance(){return head('📅 Attendance','ရက်တစ်ရက်ချင်းနှိပ်ပြီး သတ်မှတ်ပါ')+`<div class="card"><div class="row"><div>${emp()}</div><input id="period" class="control" type="month" value="${S.period}"></div><div class="legend"><span class="pill">🔵 အလုပ်ဆင်း</span><span class="pill">🔴 ပျက်</span><span class="pill">🟡 နား</span><span class="pill">🟣 ခွင့်</span></div></div><div class="section calendar">${dates().map(d=>{let x=st(d);return `<button class="day ${x}" onclick="pick('${d.toISOString().slice(0,10)}')"><span>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}</span><strong>${d.getDate()}/${d.getMonth()+1}</strong><span>${({attend:'အလုပ်ဆင်း',absent:'ပျက်',off:'နား',leave:'ခွင့်'})[x]||'—'}</span></button>`}).join('')}</div>`}function salaryPage(){let c=salary();return head('💰 လစာ','တစ်ရက်လစာ၊ OT၊ နုတ်ငွေ')+`<div class="card">${emp()}<div class="row"><input id="daily" class="control" type="number" value="${S.daily}" placeholder="တစ်ရက်လစာ"><input id="period" class="control" type="month" value="${S.period}"></div><div class="row"><input id="extra" class="control" type="number" value="${S.extra}" placeholder="အပိုငွေ"><input id="deductions" class="control" type="number" value="${S.deductions}" placeholder="နုတ်ငွေ"></div><button class="bigbtn" onclick="saveSal()">💾 သိမ်းမည်</button></div><div class="section card"><p>အလုပ်ဆင်း ${c.attend} ရက် × ${fmt(S.daily)} = <b>${fmt(c.base)} THB</b></p><h2 class="green">ရရှိမည့်လစာ — ${fmt(c.final)} THB</h2></div>`}function settings(){return head('⚙️ Settings','Login Account')+`<div class="card"><input id="nu" class="control" value="${esc(S.user)}" placeholder="Username"><input id="np" class="control" type="password" placeholder="Password အသစ်"><input id="np2" class="control" type="password" placeholder="Password ပြန်ရိုက်ပါ"><button class="bigbtn" onclick="changeAcc()">🔐 သိမ်းမည်</button></div>`}function months(a,b){let x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00'),n=(y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth();if(y.getDate()<x.getDate())n--;return Math.max(0,n)}function info(d){let p=+d.principal||0,r=+d.rate||10,m=p*r/100,now=new Date().toISOString().slice(0,10),mo=months(d.loanDate,now),ac=m*mo,paid=+d.interestPaid||0,stop=+d.interestStop||0,ib=Math.max(0,ac-paid-stop),un=m?Math.ceil(ib/m-1e-9):0,pp=+d.principalPaid||0,pb=Math.max(0,p-pp);return{p,r,m,mo,ac,paid,stop,ib,un,pp,pb,total:pb+ib}}function names(){return[...new Set(S.debts.map(d=>d.borrower).filter(Boolean))]}function debt(){if(!sel){let ns=names();return head('📒 အကြွေးစာရင်း','အမည်ကို အရင်နှိပ်ပါ')+`<div class="toprow"><h3>👤 ချေးငွေယူသူ</h3><button class="add" onclick="editLoan()">＋ ချေးငွေ</button></div><div class="horizontal">${ns.map(n=>`<div class="person" onclick="sel='${esc(n)}';render()">👤<b>${esc(n)}</b><span class="muted">${S.debts.filter(d=>d.borrower===n).length} မျိုး</span></div>`).join('')||'<div class="card">မရှိသေးပါ။ ＋ ချေးငွေ ကိုနှိပ်ပါ။</div>'}</div>`}let ls=S.debts.filter(d=>d.borrower===sel);return head('👤 '+esc(sel),'ချေးငွေအမျိုးအစားကို အလျားလိုက်ရွေးပါ')+`<div class="backline"><button class="back" onclick="sel='';render()">← အမည်များ</button><button class="add" onclick="editLoan('${esc(sel)}')">＋ ချေးငွေအမျိုးအစား</button></div><div class="horizontal">${ls.map(d=>{let x=info(d);return `<div class="loan" onclick="detail('${d.id}')">💳 <b>${esc(d.type||'Loan')}</b><span class="muted">${fmt(x.p)} THB · ${x.r}% / လ</span><span class="red">ပေးရန် ${fmt(x.total)} THB</span></div>`}).join('')||'<div class="card">ချေးငွေမရှိသေးပါ။</div>'}</div>`}function detail(id){let d=S.debts.find(x=>x.id===id),x=info(d);modal.innerHTML=`<div class="sheet"><div class="sheethead"><div><h2>💳 ${esc(d.type||'Loan')}</h2><span class="muted">${esc(d.borrower)}</span></div><button class="close" onclick="closeModal()">×</button></div><div class="card section"><div class="muted">စုစုပေါင်းပေးရန်</div><div class="amount red">${fmt(x.total)} THB</div></div><div class="kpis section"><div class="kpi">မူရင်း<b>${fmt(x.p)} THB</b></div><div class="kpi">အတိုး / လ<b>${x.r}%</b></div><div class="kpi">တစ်လအတိုး<b>${fmt(x.m)}</b></div><div class="kpi">ချေးယူသည့်ရက်<b>${d.loanDate}</b></div><div class="kpi">ကြာချိန်<b>${x.mo} လ</b></div><div class="kpi">အတိုးတက်<b>${fmt(x.ac)} THB</b></div><div class="kpi">အတိုးပေးပြီး<b>${fmt(x.paid)} THB</b></div><div class="kpi">အတိုးရပ်/လျှော့<b>${fmt(x.stop)} THB</b></div><div class="kpi">မပေးသေး<b>${x.un} လ</b></div><div class="kpi">မူရင်းပေးပြီး<b>${fmt(x.pp)}</b></div><div class="kpi">မူရင်းလက်ကျန်<b>${fmt(x.pb)}</b></div><div class="kpi">လစဉ်သတ်မှတ်<b>${fmt(d.monthlyPayment||0)}</b></div></div><div class="section"><table class="table"><tr><td>ကျန်အတိုး</td><td class="right"><b>${fmt(x.ib)} THB</b></td></tr><tr><td>မူရင်းလက်ကျန်</td><td class="right"><b>${fmt(x.pb)} THB</b></td></tr><tr><td>စုစုပေါင်း</td><td class="right"><b class="red">${fmt(x.total)} THB</b></td></tr></table></div><div class="row section"><button class="small" onclick="editLoan('', '${d.id}')">✏️ ပြင်</button><button class="small danger" onclick="delLoan('${d.id}')">🗑 ဖျက်</button></div></div>`;modal.classList.remove('hidden')}function editLoan(b='',id=''){let d=id?S.debts.find(x=>x.id===id):{borrower:b,type:'Loan',principal:0,rate:10,loanDate:new Date().toISOString().slice(0,10),interestPaid:0,interestStop:0,principalPaid:0,monthlyPayment:0};modal.innerHTML=`<div class="sheet"><div class="sheethead"><h2>${id?'✏️ ချေးငွေပြင်':'＋ ချေးငွေအသစ်'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="formrow"><label>ချေးငွေယူသူအမည်</label><input id="b" class="control" value="${esc(d.borrower)}"></div><div class="formrow"><label>ချေးငွေအမျိုးအစား</label><input id="t" class="control" value="${esc(d.type)}"></div><div class="formrow"><label>ချေးငွေမူရင်း THB</label><input id="p" class="control" type="number" value="${d.principal}"></div><div class="formrow"><label>အတိုး % / လ</label><input id="r" class="control" type="number" step="0.01" value="${d.rate}"></div><div class="formrow"><label>ချေးယူသည့်ရက်</label><input id="ld" class="control" type="date" value="${d.loanDate}"></div><div class="formrow"><label>လစဉ်သတ်မှတ်ငွေ</label><input id="mp" class="control" type="number" value="${d.monthlyPayment||0}"></div><div class="formrow"><label>အတိုးပေးပြီးငွေ</label><input id="ip" class="control" type="number" value="${d.interestPaid||0}"></div><div class="formrow"><label>အတိုးရပ် / လျှော့ငွေ</label><input id="is" class="control" type="number" value="${d.interestStop||0}"></div><div class="formrow"><label>မူရင်းပေးပြီးငွေ</label><input id="pp" class="control" type="number" value="${d.principalPaid||0}"></div><div class="full muted">20,000 THB ကို 10% / လ ချေးရင် တစ်လအတိုး 2,000 THB။ ချေးယူသည့်ရက်မှ လအလိုက်တွက်ပြီး အတိုးပေးပြီးငွေနဲ့ အတိုးရပ်/လျှော့ငွေကို နုတ်ပေးပါတယ်။</div></div><button class="bigbtn" onclick="saveLoan('${id}')">💾 သိမ်းမည်</button></div>`;modal.classList.remove('hidden')}function saveLoan(id){let d={id:id||'D'+Date.now(),borrower:b.value.trim(),type:t.value.trim()||'Loan',principal:+p.value||0,rate:+r.value||10,loanDate:ld.value,monthlyPayment:+mp.value||0,interestPaid:+ip.value||0,interestStop:+is.value||0,principalPaid:+pp.value||0};if(!d.borrower||!d.loanDate)return alert('အမည်နဲ့ ချေးယူသည့်ရက် ထည့်ပါ');if(id){let i=S.debts.findIndex(x=>x.id===id);if(i>=0)S.debts[i]=d}else S.debts.push(d);save();sel=d.borrower;closeModal();render()}function delLoan(id){if(confirm('ဒီချေးငွေကို ဖျက်မလား?')){S.debts=S.debts.filter(x=>x.id!==id);save();closeModal();render()}}function pick(date){let a=[['attend','🔵 အလုပ်ဆင်း'],['absent','🔴 ပျက်'],['off','🟡 နား'],['leave','🟣 ခွင့်']];modal.innerHTML=`<div class="sheet"><div class="sheethead"><h2>${date}</h2><button class="close" onclick="closeModal()">×</button></div>${a.map(x=>`<button class="mi" onclick="setDay('${date}','${x[0]}')">${x[1]}</button>`).join('')}<button class="mi" onclick="setDay('${date}','')">⚪ မသတ်မှတ်</button></div>`;modal.classList.remove('hidden')}function setDay(date,x){let k=S.employee+'_'+S.period+'_'+date;if(x)S.records[k]=x;else delete S.records[k];save();closeModal();render()}function closeModal(){modal.classList.add('hidden')}function bind(){let e=document.getElementById('emp');if(e)e.onchange=()=>{S.employee=e.value;save();render()};let q=document.getElementById('period');if(q)q.onchange=()=>{S.period=q.value;save();render()}}function saveSal(){S.daily=+daily.value||0;S.extra=+extra.value||0;S.deductions=+deductions.value||0;S.period=period.value;save();render();alert('လစာ သိမ်းပြီးပါပြီ')}function changeAcc(){if(!nu.value.trim())return alert('Username ထည့်ပါ');if(np.value&&np.value!==np2.value)return alert('Password မတူပါ');S.user=nu.value.trim();if(np.value)S.pass=np.value;save();alert('Account ပြောင်းပြီးပါပြီ');go('dashboard')}if(localStorage.getItem('salary_session')==='1')showApp();</script></body></html>
