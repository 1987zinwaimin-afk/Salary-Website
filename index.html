<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary System</title>

<style>

body{
font-family:Arial;
background:#f1f5f9;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:15px;
max-width:500px;
margin:auto;
margin-top:50px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="box" id="loginPage">

<h2>Login</h2>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button type="submit">
Login
</button>

</form>

</div>

<div class="box hidden" id="mainPage">

<h1>Salary System ✅</h1>

<p>
Login Success
</p>

</div>

<script>

const form =
document.getElementById("loginForm");

form.addEventListener("submit",function(e){

e.preventDefault();

let user =
document.getElementById("username").value.trim();

let pass =
document.getElementById("password").value.trim();

if(user === "admin" && pass === "1234"){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainPage")
.classList.remove("hidden");

}
else{

alert("Wrong Username or Password");

}

});

</script>

</body>
</html>
