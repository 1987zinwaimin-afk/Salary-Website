name: Fix Share Payment Button

on:
  push:
    paths:
      - '.share-pay-fix-trigger'
      - '.github/workflows/fix-share-pay-button.yml'

permissions:
  contents: write

jobs:
  patch-share-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch share payment button
        shell: python
        run: |
          from pathlib import Path
          p = Path('share.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('<!-- share-payment-fix-start -->')
          end = s.find('<!-- share-payment-fix-end -->')
          if start >= 0 and end >= 0:
              s = s[:start] + s[end + len('<!-- share-payment-fix-end -->'):]

          fix = r'''<!-- share-payment-fix-start -->
<style>
#modal{z-index:10000!important}
#modal .sheet{position:relative;z-index:10001}
#modal input,#modal button{pointer-events:auto!important;touch-action:manipulation!important}
.detail button.pay{position:relative;z-index:10010!important;pointer-events:auto!important;cursor:pointer!important;min-height:48px}
</style>
<script>
// Robust share payment fix
(function(){
  function toast(msg){
    const old=document.querySelector('.toast'); if(old) old.remove();
    const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
    document.body.appendChild(d); setTimeout(()=>d.remove(),3200);
  }

  window.openPay=function(id){
    const loans = (typeof current!=='undefined' && Array.isArray(current?.payload?.loans))
      ? current.payload.loans : [];
    const loan = loans.find(x=>String(x.id)===String(id));
    if(!loan){ toast('❌ ချေးငွေစာရင်း မတွေ့ပါ'); return; }
    const cur=loan.currency||'MMK';
    const old=document.getElementById('modal'); if(old) old.remove();
    const d=document.createElement('div'); d.id='modal';
    d.innerHTML=`<div class="sheet">
      <h2>💸 ငွေပေးချေမည်</h2>
      <p>${esc(loan.name||loan.type||'ချေးငွေ')} · ${esc(cur)}</p>
      <input id="payName" placeholder="ပေးချေသူအမည်" value="${esc(typeof viewerName==='function'?viewerName():'')}">
      <input id="payAmount" inputmode="decimal" type="number" min="1" step="0.01" placeholder="ငွေပမာဏ (${esc(cur)})" style="margin-top:8px">
      <div class="quick">
        <button type="button" data-q="1000">1,000</button>
        <button type="button" data-q="5000">5,000</button>
        <button type="button" data-q="10000">10,000</button>
        <button type="button" data-q="20000">20,000</button>
      </div>
      <div class="info">ငွေပေးချေမှုကို Owner ဆီ Approval Request အဖြစ် ပို့ပါမည်။ Owner လက်ခံပြီးမှ အကြွေးစာရင်းထဲသို့ ထည့်ပေးပါမည်။</div>
      <div class="btns"><button type="button" class="cancel" id="payCancel">မလုပ်တော့ပါ</button><button type="button" class="send" id="paySend">Request ပို့မည်</button></div>
    </div>`;
    document.body.appendChild(d);
    d.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{d.querySelector('#payAmount').value=b.dataset.q}));
    d.querySelector('#payCancel').addEventListener('click',()=>d.remove());
    d.addEventListener('click',e=>{if(e.target===d)d.remove()});
    d.querySelector('#paySend').addEventListener('click',async()=>{
      const name=d.querySelector('#payName').value.trim()||'Guest';
      const amount=Number(d.querySelector('#payAmount').value);
      if(!amount||amount<=0){toast('ငွေပမာဏ ထည့်ပါ');return;}
      const btn=d.querySelector('#paySend'); btn.disabled=true; btn.textContent='ပို့နေသည်…';
      try{
        const shareToken=(typeof token!=='undefined'?token:(location.hash.slice(1).trim()));
        await rpc('submit_salary_payment_request',{
          p_share_token:shareToken,
          p_loan_id:String(id),
          p_payer_name:name,
          p_amount:amount,
          p_currency:cur,
          p_device_label:typeof deviceLabel==='function'?deviceLabel():navigator.userAgent
        });
        d.remove();
        toast('✅ Payment Request Owner ဆီ ပို့ပြီးပါပြီ');
        if(typeof getShare==='function' && typeof render==='function'){
          try{render(await getShare())}catch(e){}
        }
      }catch(e){
        console.error(e); toast('❌ Request မပို့နိုင်ပါ');
        btn.disabled=false; btn.textContent='Request ပို့မည်';
      }
    });
  };

  function wire(){
    const buttons=[...document.querySelectorAll('.detail button.pay')];
    const loans=(typeof current!=='undefined' && Array.isArray(current?.payload?.loans))?current.payload.loans:[];
    buttons.forEach((b,i)=>{
      if(b.dataset.sharePayWired==='1') return;
      b.dataset.sharePayWired='1';
      b.type='button';
      b.onclick=null;
      const id=b.getAttribute('data-pay')||b.getAttribute('data-loan-id')||b.dataset.id||(loans[i]&&loans[i].id);
      b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();window.openPay(id)},true);
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',wire); else wire();
  new MutationObserver(wire).observe(document.body,{childList:true,subtree:true});
})();
</script>
<!-- share-payment-fix-end -->
'''
          idx=s.rfind('</body>')
          if idx<0:
              raise SystemExit('body closing tag not found')
          s=s[:idx]+fix+s[idx:]
          p.write_text(s,encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share.html
          git diff --cached --quiet && exit 0
          git commit -m 'make share payment button clickable'
          git push
