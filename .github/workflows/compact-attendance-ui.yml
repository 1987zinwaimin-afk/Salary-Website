name: Compact Attendance UI

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

permissions:
  contents: write

jobs:
  compact-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact Attendance form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="card"><div class="row"><div><label class="muted">ဝန်ထမ်း</label>${empSelect()}</div>'
          new='<div class="card attendanceSettings"><div class="row"><div><label class="muted">ဝန်ထမ်း</label>${empSelect()}</div>'
          if 'class="attendanceSettings"' not in s:
              s=s.replace(old,new,1)
          style='''<style>\n/* Compact, clean mobile form layout */\n.attendanceSettings{padding:14px 14px 12px;border-radius:20px}\n.attendanceSettings .row{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:0!important}\n.attendanceSettings .muted{font-size:11px;line-height:1.25;display:block;margin-bottom:4px}\n.attendanceSettings .control{padding:10px 11px;min-height:43px;border-radius:12px;font-size:14px}\n.attendanceSettings .formrow{margin:0}\n.attendanceSettings .bigbtn{padding:11px 12px;margin-top:8px;border-radius:13px;font-size:13px}\n.attendanceSettings .legend{margin:7px 0 0;gap:5px}\n.attendanceSettings .pill{padding:6px 8px;font-size:10px}\n.calendar{gap:5px}\n.day{min-height:64px;border-radius:12px;padding:5px;border-width:1.5px}\n.day strong{font-size:15px}\n.day .dow{font-size:9px}\n.day .status{font-size:8px}\n@media(max-width:390px){.attendanceSettings .row{gap:6px}.attendanceSettings .control{padding:9px 9px;font-size:13px}.attendanceSettings .pill{padding:5px 7px;font-size:9px}}\n</style>'''
          if 'Compact, clean mobile form layout' not in s:
              s=s.replace('</style></head>','</style>'+style+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit compact UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Compact Attendance mobile layout"
          git push
