name: Update Dashboard Layout

on:
  push:
    branches: [main]
    paths:
      - '.dashboard-layout-trigger'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('@media(max-width:560px){.moneyGrid{grid-template-columns:1fr}}','@media(max-width:560px){.row{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}')
          start=s.index('function dashboardPage()')
          end=s.index('function openBorrower', start)
          new='''function dashboardPage(){let c=salaryCalc(),bs=borrowers(),groups={};S.debts.forEach(l=>{let cur=l.currency||'THB',x=loanCalc(l);groups[cur]??={principal:0,total:0,interest:0,payable:0,count:0};groups[cur].principal+=+l.principal||0;groups[cur].total+=x.total;groups[cur].interest+=x.outInterest;groups[cur].payable+=0;groups[cur].count++});let card=(cur,label,cls)=>{let g=groups[cur]||{principal:0,total:0,interest:0,payable:0,count:0};return `<section class="moneyCard ${cls}"><div class="muted">${cur==='MMK'?'🇲🇲':'🇹🇭'} ${label}</div><div class="big">${money(g.total,cur)}</div><div class="moneyLine"><span>ရရန်</span><b>${money(g.total,cur)}</b></div><div class="moneyLine"><span>ပေးရန်</span><b>${money(g.payable,cur)}</b></div></section>`};return head('🏠 Dashboard','အကြွေးစာရင်းကို အပေါ်မှာ အရင်ကြည့်ရန်')+`<div class="dashMonth"><label class="muted">လစာကာလ</label><input id="period" class="control" type="month" value="${S.period}"></div><div class="dashTitle"><h3>📒 အကြွေးစာရင်း</h3><p>မြန်မာငွေ / ထိုင်းဘတ်ကို သီးခြားပြထားသည်</p></div><div class="moneyGrid debtTopGrid">${card('MMK','မြန်မာကျပ် (MMK)','red')} ${card('THB','ထိုင်းဘတ် (THB)','red')}</div><div class="dashTitle salaryDashTitle"><h3>💰 ဝန်ထမ်းလစာ</h3><p>ရွေးထားသောဝန်ထမ်း၏ ဒီလလစာ</p></div><div class="moneyGrid"><section class="moneyCard green"><div class="muted">💰 ရရှိမည့်လစာ</div><div class="big">${money(c.final,'THB')}</div><div class="moneyLine"><span>အလုပ်ဆင်း</span><b>${c.attend} ရက်</b></div><div class="moneyLine"><span>တစ်ရက်လစာ</span><b>${money(S.daily,'THB')}</b></div><div class="moneyLine"><span>အပို / နုတ်</span><b>${money((+S.extra||0)-(+S.deductions||0),'THB')}</b></div></section><section class="moneyCard blue"><div class="muted">👤 ဝန်ထမ်း</div><div class="big">${esc(S.employee)}</div><div class="moneyLine"><span>လစာအခြေခံ</span><b>${money(c.base,'THB')}</b></div><div class="moneyLine"><span>ဝန်ထမ်းစုစုပေါင်း</span><b>${bs.length} ယောက်</b></div><button class="smallbtn" style="padding:7px 9px;font-size:11px;margin-top:5px" onclick="go('attendance')">📅 Attendance →</button></section></div><div class="dashActions"><button class="dashAction" onclick="go('attendance')"><b>📅 Attendance</b><small>အလုပ်ဆင်းရက် စီမံရန်</small></button><button class="dashAction" onclick="go('debt')"><b>➕ အကြွေး</b><small>ချေးငွေ အသစ်ထည့်ရန်</small></button></div>`}'''
          s=s[:start]+new+s[end:]
          s=s.replace('.dashActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}', '.salaryDashTitle{margin-top:12px}.debtTopGrid .moneyCard{min-height:0}.dashActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}')
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Move debt summary above salary on dashboard'
          git push
